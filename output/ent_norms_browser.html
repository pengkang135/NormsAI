<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业定额库 · 骨架</title>
<style>
:root {
  --bg:#fdfcfa; --sidebar-bg:#f4f1e9; --card-bg:#fff;
  --border:#e8e3d7; --border-light:#f0ece2;
  --text:#2d2416; --text-dim:#8c8274; --text-faint:#b8af9e;
  --accent:#c75b39; --accent-light:#faf2ee;
  --code-bg:#faf7f2; --hover-bg:#f9f6ef;
  --shadow-sm:0 1px 3px rgba(44,36,22,.06);
  --radius:6px; --radius-sm:3px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Noto Serif SC','SimSun','STSong',serif;
  background:var(--bg); color:var(--text);
  display:flex; height:100vh; overflow:hidden;
  font-size:14px; line-height:1.5;
}

.sidebar{width:360px; min-width:360px; background:var(--sidebar-bg);
  border-right:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden}
.sidebar-header{padding:14px 20px 8px; border-bottom:1px solid var(--border)}
.sidebar-header h1{font-size:15px; font-weight:700}
.sidebar-header .sub{font-size:11px; color:var(--text-dim); margin-top:2px}

.tabs{display:flex; border-bottom:1px solid var(--border)}
.tab{
  flex:1; padding:10px 12px; text-align:center; cursor:pointer;
  font-size:13px; color:var(--text-dim); user-select:none;
  border-bottom:2px solid transparent;
}
.tab.active{color:var(--accent); border-bottom-color:var(--accent); font-weight:600; background:var(--accent-light)}
.tab:hover:not(.active){background:var(--hover-bg)}

.picker{padding:10px 16px 4px; border-bottom:1px solid var(--border)}
.picker label{font-size:11px; color:var(--text-dim); display:block; margin-bottom:4px}
.picker select{
  width:100%; padding:6px 10px;
  border:1px solid var(--border); border-radius:var(--radius-sm);
  background:var(--card-bg); font-size:13px; font-family:inherit;
  color:var(--text); outline:none; cursor:pointer;
}
.picker select:focus{border-color:var(--accent)}

.search-wrap{padding:6px 16px 10px; border-bottom:1px solid var(--border)}
.search-wrap input{
  width:100%; padding:6px 10px;
  border:1px solid var(--border); border-radius:var(--radius-sm);
  background:var(--card-bg); font-size:12px; font-family:inherit;
  outline:none;
}
.search-wrap input:focus{border-color:var(--accent)}

.nav{flex:1; overflow-y:auto; padding:6px 0}
.nav-item{
  display:flex; align-items:center; gap:6px;
  padding:5px 12px 5px 16px; cursor:pointer;
  border-left:2px solid transparent;
  font-size:13px; user-select:none;
}
.nav-item:hover{background:rgba(199,91,57,.04)}
.nav-item.active{background:var(--accent-light); border-left-color:var(--accent); color:var(--accent); font-weight:600}
.nav-item .caret{display:inline-block; width:10px; text-align:center; color:var(--text-faint); font-size:10px}
.nav-item.no-children .caret{visibility:hidden}
.nav-item .code{font-family:'Consolas','Menlo',monospace; font-size:11px; color:var(--text-dim); white-space:nowrap}
.nav-item .name{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.nav-item .badge{font-size:10px; color:var(--text-faint); padding:0 4px}
.nav-empty{padding:24px 20px; color:var(--text-dim); font-size:12px; text-align:center; line-height:1.7}
.nav-loading{padding:24px 20px; color:var(--text-dim); font-size:12px; text-align:center}

.main{flex:1; overflow-y:auto; padding:32px 40px}
.detail-empty{color:var(--text-faint); text-align:center; padding-top:80px}
.detail-header{border-bottom:1px solid var(--border-light); padding-bottom:14px; margin-bottom:20px}
.detail-code{font-family:'Consolas','Menlo',monospace; font-size:12px; color:var(--text-dim)}
.detail-name{font-size:22px; font-weight:700; margin-top:4px}
.detail-name-en{font-size:13px; color:var(--text-dim); margin-top:2px; font-style:italic}
.detail-meta{display:flex; gap:20px; margin-top:8px; font-size:12px; color:var(--text-dim); flex-wrap:wrap}
.detail-meta span strong{color:var(--text); font-weight:600}

.section{margin-top:20px}
.section-title{
  font-size:12px; font-weight:700; color:var(--text-dim);
  text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px;
}
.card{background:var(--card-bg); border:1px solid var(--border-light); border-radius:var(--radius); padding:12px 14px; box-shadow:var(--shadow-sm)}
.card + .card{margin-top:6px}
.card pre{font-family:inherit; white-space:pre-wrap; word-break:break-word; font-size:13px; line-height:1.7}
.mute{color:var(--text-faint); font-style:italic}

.norm-table{width:100%; border-collapse:collapse; font-size:13px}
.norm-table th, .norm-table td{padding:6px 10px; border-bottom:1px solid var(--border-light); text-align:left}
.norm-table th{font-weight:600; color:var(--text-dim); font-size:11px; text-transform:uppercase; letter-spacing:.4px}
.norm-table td.num{text-align:right; font-family:'Consolas','Menlo',monospace; font-size:12px}
.norm-table tr.clickable:hover{background:var(--hover-bg); cursor:pointer}
.norm-table .code-cell{font-family:'Consolas','Menlo',monospace; color:var(--accent); font-size:12px}

.banner{padding:10px 14px; background:#fff8f0; border:1px solid #f4d9b0; border-radius:var(--radius); margin-bottom:20px; font-size:12px; color:#7a5a26}
.stats{font-size:11px; color:var(--text-dim); padding:8px 16px; border-top:1px solid var(--border)}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-header">
    <h1>企业定额库 · 骨架</h1>
    <div class="sub">WBS 12 位编码 + 3 源定额池</div>
  </div>

  <div class="tabs">
    <div class="tab active" data-view="wbs">WBS 骨架</div>
    <div class="tab" data-view="pool">源库定额池</div>
  </div>

  <div class="picker" id="picker-wbs">
    <label>切换专业</label>
    <select id="discSelect"></select>
  </div>

  <div class="picker" id="picker-pool" style="display:none">
    <label>选择源库</label>
    <select id="sourceSelect">
      <option value="1">北京 2012 主库 (25330 定额)</option>
      <option value="2">北京 2012 修缮 (13552 定额)</option>
      <option value="3">JTS276 港口水工 (34024 项)</option>
    </select>
  </div>

  <div class="search-wrap">
    <input id="searchBox" placeholder="搜索 编码 / 名称...">
  </div>

  <nav class="nav" id="nav"></nav>

  <div class="stats" id="stats"></div>
</aside>

<main class="main" id="detail">
  <div class="detail-empty">← 从左侧选择一个节点查看详情</div>
</main>

<script>
let DATA = null;   // skeleton
let POOL = null;   // 大 JSON，切到 Pool 视图时懒加载
let currentView = 'wbs';
let currentDisc = null;
let currentSource = 1;
let selectedKey = null;   // wbs_code 或 'norm:{source_id}:{norm_ID}' 或 'chap:...'
const collapsed = new Set();

// ============== 初始化 ==============
fetch('ent_norms_data.json').then(r => r.json()).then(d => {
  DATA = d;
  initDiscSelect();
  renderStats();
  switchView('wbs');
  bindEvents();
}).catch(err => {
  document.getElementById('detail').innerHTML =
    '<div class="detail-empty">加载 ent_norms_data.json 失败：' + err + '</div>';
});

function initDiscSelect(){
  const sel = document.getElementById('discSelect');
  DATA.disciplines.forEach(d => {
    const n = (DATA.stats.wbs_class_by_disc || {})[d] || 0;
    const opt = document.createElement('option');
    opt.value = d;
    opt.textContent = `${d}  (WBS: ${n})`;
    sel.appendChild(opt);
  });
  currentDisc = DATA.disciplines[0];
}

function renderStats(){
  const s = DATA.stats;
  document.getElementById('stats').innerHTML =
    `WBS ${s.wbs_class_total} · 主库 ${s.bj2012_main.norm} · 修缮 ${s.bj2012_repair.norm} · JTS ${s.jts276.norms_item}<br>` +
    `映射 ${s.mapping_total} · 回套线索 ${s.wbs_beijing_hint_count}`;
}

function bindEvents(){
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => switchView(t.dataset.view));
  });
  document.getElementById('discSelect').addEventListener('change', e => {
    currentDisc = e.target.value;
    selectedKey = null;
    renderNav();
    renderDetail();
  });
  document.getElementById('sourceSelect').addEventListener('change', e => {
    currentSource = parseInt(e.target.value, 10);
    selectedKey = null;
    collapsed.clear();
    renderNav();
    renderDetail();
  });
  document.getElementById('searchBox').addEventListener('input', () => renderNav());
}

async function switchView(view){
  currentView = view;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === view));
  document.getElementById('picker-wbs').style.display  = view === 'wbs' ? '' : 'none';
  document.getElementById('picker-pool').style.display = view === 'pool' ? '' : 'none';
  document.getElementById('searchBox').value = '';
  selectedKey = null;

  if (view === 'pool' && !POOL){
    document.getElementById('nav').innerHTML = '<div class="nav-loading">加载源库池数据 (~16 MB)...</div>';
    try {
      const r = await fetch('ent_pool_data.json');
      POOL = await r.json();
      indexPool();
    } catch(err){
      document.getElementById('nav').innerHTML = '<div class="nav-empty">加载失败：' + err + '</div>';
      return;
    }
  }
  renderNav();
  renderDetail();
}

// 建索引：分 source_id 的 chapter 树 + Norm 按 chap_ID 分桶
function indexPool(){
  POOL.byChapId = {};       // "sid:chap_ID" → chapter row
  POOL.rootsBySource = {1:[],2:[],3:[]};
  POOL.childrenByPid = {};  // "sid:chap_PID" → [chapters]
  POOL.normsByChap = {};    // "sid:chap_ID" → [norms]
  POOL.jtsTablesByChap = {}; // "sid:chapter_id" → [tables]
  POOL.jtsItemsByTable = {}; // "sid:table_id" → [items]

  for (const c of POOL.bj_chapters){
    c.children = [];
    const k = `1:${c.chap_ID}`.replace(/^\d+/, c.source_id);
    POOL.byChapId[`${c.source_id}:${c.chap_ID}`] = c;
    if (c.chap_PID === 0 || c.chap_PID === null){
      POOL.rootsBySource[c.source_id].push(c);
    } else {
      const pk = `${c.source_id}:${c.chap_PID}`;
      (POOL.childrenByPid[pk] = POOL.childrenByPid[pk] || []).push(c);
    }
  }
  // 把子节点挂到父节点上
  for (const c of POOL.bj_chapters){
    const kids = POOL.childrenByPid[`${c.source_id}:${c.chap_ID}`] || [];
    c.children = kids;
  }
  for (const n of POOL.bj_norms){
    const k = `${n.source_id}:${n.chap_ID}`;
    (POOL.normsByChap[k] = POOL.normsByChap[k] || []).push(n);
  }

  // JTS
  for (const c of POOL.jts_chapters){
    c.children = [];
  }
  const jtsById = {};
  for (const c of POOL.jts_chapters){ jtsById[c.id] = c; }
  for (const c of POOL.jts_chapters){
    if (c.parent_id && jtsById[c.parent_id]){
      jtsById[c.parent_id].children.push(c);
    } else {
      POOL.rootsBySource[3].push(c);
    }
  }
  for (const t of POOL.jts_norms_tables){
    (POOL.jtsTablesByChap[`3:${t.chapter_id}`] = POOL.jtsTablesByChap[`3:${t.chapter_id}`] || []).push(t);
  }
  for (const it of POOL.jts_items){
    (POOL.jtsItemsByTable[`3:${it.table_id}`] = POOL.jtsItemsByTable[`3:${it.table_id}`] || []).push(it);
  }
}

// ============== 渲染 ==============
function renderNav(){
  const nav = document.getElementById('nav');
  const kw = document.getElementById('searchBox').value.trim();
  nav.innerHTML = '';

  if (currentView === 'wbs'){
    renderWbsNav(nav, kw);
  } else {
    renderPoolNav(nav, kw);
  }
}

function renderWbsNav(nav, kw){
  const roots = DATA.wbs_tree_by_disc[currentDisc] || [];
  if (roots.length === 0){
    nav.innerHTML = `<div class="nav-empty">「${currentDisc}」专业<br>WBS 骨架待完善<br>建议切到「源库定额池」浏览</div>`;
    return;
  }
  let visible = null;
  if (kw){
    const flat = [];
    const walk = ns => { for (const n of ns){ flat.push(n); walk(n.children||[]); } };
    walk(roots);
    const K = kw.toLowerCase();
    visible = new Set(flat.filter(n =>
      n.wbs_code.includes(kw) || (n.name_cn||'').toLowerCase().includes(K)
    ).map(n => n.wbs_code));
    const byCode = {}; flat.forEach(n => byCode[n.wbs_code] = n);
    for (const c of Array.from(visible)){
      let p = byCode[c].parent_code;
      while (p && !visible.has(p)){ visible.add(p); p = byCode[p] && byCode[p].parent_code; }
    }
  }
  roots.forEach(r => renderWbsNode(nav, r, 0, visible));
}

function renderWbsNode(container, node, depth, visible){
  if (visible && !visible.has(node.wbs_code)) return;
  const hasChildren = (node.children || []).length > 0;
  const isCollapsed = collapsed.has('wbs:' + node.wbs_code);
  const key = node.wbs_code;
  const item = document.createElement('div');
  item.className = 'nav-item' + (hasChildren ? '' : ' no-children') + (selectedKey === key ? ' active' : '');
  item.style.paddingLeft = (16 + depth*14) + 'px';
  item.innerHTML =
    `<span class="caret">${hasChildren ? (isCollapsed ? '▸' : '▾') : ''}</span>` +
    `<span class="code">${node.wbs_code}</span>` +
    `<span class="name">${esc(node.name_cn)}</span>`;
  item.addEventListener('click', e => {
    if (hasChildren && (e.target.classList.contains('caret') || e.offsetX < 30)){
      const k = 'wbs:' + node.wbs_code;
      if (isCollapsed) collapsed.delete(k); else collapsed.add(k);
      renderNav();
      return;
    }
    selectedKey = key;
    renderNav();
    renderWbsDetail(node);
  });
  container.appendChild(item);
  if (hasChildren && !isCollapsed){
    node.children.forEach(c => renderWbsNode(container, c, depth+1, visible));
  }
}

function renderPoolNav(nav, kw){
  if (!POOL) { nav.innerHTML = '<div class="nav-loading">加载中...</div>'; return; }
  const roots = POOL.rootsBySource[currentSource] || [];
  if (roots.length === 0){ nav.innerHTML = '<div class="nav-empty">该源库无数据</div>'; return; }

  if (currentSource === 3){
    // JTS: chapter 树 → 末端点开显示 norms_tables → 点表看 items
    roots.forEach(r => renderJtsNode(nav, r, 0, kw));
    return;
  }
  // BJ 主库/修缮：chapter 树，末端章节挂 Norm 数量
  roots.forEach(r => renderBjNode(nav, r, 0, kw));
}

function renderBjNode(container, node, depth, kw){
  const nodeChildren = node.children || [];
  const normsHere = POOL.normsByChap[`${currentSource}:${node.chap_ID}`] || [];
  const hasChildren = nodeChildren.length > 0 || normsHere.length > 0;
  const key = 'chap:' + currentSource + ':' + node.chap_ID;
  const isCollapsed = collapsed.has(key);

  // 简单搜索：命中则展开（这里为性能省略递归展开策略）
  if (kw){
    const K = kw.toLowerCase();
    const matches = (node.chap_code||'').includes(kw) || (node.chap_Name||'').toLowerCase().includes(K);
    // 有子节点或 Norm 命中的分支都要保留 —— 简化：只显示章节本身命中或有命中 Norm
    const normHit = normsHere.some(n =>
      (n.norm_Code||'').includes(kw) || (n.norm_Name||'').toLowerCase().includes(K)
    );
    if (!matches && !normHit && nodeChildren.length === 0){ return; }
  }

  const item = document.createElement('div');
  item.className = 'nav-item' + (hasChildren ? '' : ' no-children') + (selectedKey === key ? ' active' : '');
  item.style.paddingLeft = (16 + depth*14) + 'px';
  item.innerHTML =
    `<span class="caret">${hasChildren ? (isCollapsed ? '▸' : '▾') : ''}</span>` +
    `<span class="code">${esc(node.chap_code)}</span>` +
    `<span class="name">${esc(node.chap_Name)}</span>` +
    (normsHere.length ? `<span class="badge">${normsHere.length}</span>` : '');
  item.addEventListener('click', e => {
    if (hasChildren && (e.target.classList.contains('caret') || e.offsetX < 30)){
      if (isCollapsed) collapsed.delete(key); else collapsed.add(key);
      renderNav();
      return;
    }
    selectedKey = key;
    renderNav();
    renderBjChapDetail(node, normsHere, kw);
  });
  container.appendChild(item);
  if (hasChildren && !isCollapsed){
    nodeChildren.forEach(c => renderBjNode(container, c, depth+1, kw));
  }
}

function renderJtsNode(container, node, depth, kw){
  const nodeChildren = node.children || [];
  const tables = POOL.jtsTablesByChap[`3:${node.id}`] || [];
  const hasChildren = nodeChildren.length > 0 || tables.length > 0;
  const key = 'jts:chap:' + node.id;
  const isCollapsed = collapsed.has(key);

  const item = document.createElement('div');
  item.className = 'nav-item' + (hasChildren ? '' : ' no-children') + (selectedKey === key ? ' active' : '');
  item.style.paddingLeft = (16 + depth*14) + 'px';
  item.innerHTML =
    `<span class="caret">${hasChildren ? (isCollapsed ? '▸' : '▾') : ''}</span>` +
    `<span class="code">L${node.level||''}</span>` +
    `<span class="name">${esc(node.title || node.subtitle || '(无题)')}</span>` +
    (tables.length ? `<span class="badge">${tables.length}</span>` : '');
  item.addEventListener('click', e => {
    if (hasChildren && (e.target.classList.contains('caret') || e.offsetX < 30)){
      if (isCollapsed) collapsed.delete(key); else collapsed.add(key);
      renderNav();
      return;
    }
    selectedKey = key;
    renderNav();
    renderJtsChapDetail(node, tables);
  });
  container.appendChild(item);
  if (hasChildren && !isCollapsed){
    nodeChildren.forEach(c => renderJtsNode(container, c, depth+1, kw));
    if (tables.length > 0 && !isCollapsed){
      tables.forEach(t => renderJtsTableNode(container, t, depth+1));
    }
  }
}

function renderJtsTableNode(container, table, depth){
  const items = POOL.jtsItemsByTable[`3:${table.id}`] || [];
  const key = 'jts:tbl:' + table.id;
  const item = document.createElement('div');
  item.className = 'nav-item no-children' + (selectedKey === key ? ' active' : '');
  item.style.paddingLeft = (16 + depth*14) + 'px';
  item.innerHTML =
    `<span class="caret"></span>` +
    `<span class="code">§</span>` +
    `<span class="name">${esc(table.section_title || '(表)')}</span>` +
    `<span class="badge">${items.length}</span>`;
  item.addEventListener('click', () => {
    selectedKey = key;
    renderNav();
    renderJtsTableDetail(table, items);
  });
  container.appendChild(item);
}

// ============== 详情面板 ==============
function renderDetail(){
  if (!selectedKey){
    document.getElementById('detail').innerHTML =
      '<div class="detail-empty">← 从左侧选择一个节点查看详情</div>';
  }
}

function renderWbsDetail(node){
  const meta = [];
  if (node.standard_unit) meta.push(`<span>单位 <strong>${esc(node.standard_unit)}</strong></span>`);
  meta.push(`<span>层级 <strong>L${node.level}</strong></span>`);
  meta.push(`<span>专业 <strong>${esc(node.discipline||'')}</strong></span>`);
  let html = `
    <div class="detail-header">
      <div class="detail-code">${node.wbs_code}</div>
      <div class="detail-name">${esc(node.name_cn)}</div>
      ${node.name_en ? `<div class="detail-name-en">${esc(node.name_en)}</div>` : ''}
      <div class="detail-meta">${meta.join('')}</div>
    </div>`;
  if (node.work_content){
    html += `<div class="section"><div class="section-title">工作内容</div><div class="card"><pre>${esc(node.work_content)}</pre></div></div>`;
  }
  if (node.calc_rule){
    html += `<div class="section"><div class="section-title">计算规则</div><div class="card"><pre>${esc(node.calc_rule)}</pre></div></div>`;
  }
  if (node.beijing_hint){
    html += `<div class="section"><div class="section-title">北京定额回套口径（M1 种子）</div><div class="card"><pre>${esc(node.beijing_hint)}</pre></div></div>`;
  }
  html += `<div class="section"><div class="section-title">关联定额（映射）</div><div class="card mute">暂无关联定额 · 本节点等待映射（M1 阶段填充 wbs_norm_mapping）</div></div>`;
  document.getElementById('detail').innerHTML = html;
}

function renderBjChapDetail(chap, norms, kw){
  const src = chap.source_id === 1 ? '北京 2012 主库' : '北京 2012 修缮库';
  const K = (kw||'').toLowerCase();
  const filtered = kw ? norms.filter(n =>
    (n.norm_Code||'').includes(kw) || (n.norm_Name||'').toLowerCase().includes(K)
  ) : norms;

  let html = `
    <div class="detail-header">
      <div class="detail-code">${src} · chap_code = ${esc(chap.chap_code)}</div>
      <div class="detail-name">${esc(chap.chap_Name)}</div>
      <div class="detail-meta">
        <span>专业 <strong>${esc(chap.discipline||'')}</strong></span>
        <span>本章定额条目 <strong>${norms.length}</strong></span>
        ${kw ? `<span>过滤命中 <strong>${filtered.length}</strong></span>` : ''}
      </div>
    </div>`;
  if (filtered.length === 0){
    html += `<div class="card mute">本章暂无定额条目${kw ? '匹配' : ''}（可能是父章，请展开子章查看）</div>`;
  } else {
    html += `<div class="section"><div class="section-title">定额子目</div>
      <div class="card" style="padding:0"><table class="norm-table">
        <thead><tr>
          <th style="width:80px">编号</th><th>名称</th><th style="width:60px">单位</th>
          <th style="width:80px">人工</th><th style="width:80px">材料</th><th style="width:80px">机械</th>
          <th style="width:80px">合计</th>
        </tr></thead><tbody>`;
    for (const n of filtered.slice(0, 500)){
      const total = (n.man||0) + (n.mat||0) + (n.mach||0);
      html += `<tr>
        <td class="code-cell">${esc(n.norm_Code)}</td>
        <td>${esc(n.norm_Name)}</td>
        <td>${esc(n.unit||'')}</td>
        <td class="num">${fmt(n.man)}</td>
        <td class="num">${fmt(n.mat)}</td>
        <td class="num">${fmt(n.mach)}</td>
        <td class="num"><strong>${fmt(total)}</strong></td>
      </tr>`;
    }
    html += `</tbody></table></div>`;
    if (filtered.length > 500){
      html += `<div class="card mute" style="margin-top:8px">仅显示前 500 条 · 共 ${filtered.length} 条，使用左侧搜索缩小</div>`;
    }
    html += `</div>`;
  }
  document.getElementById('detail').innerHTML = html;
}

function renderJtsChapDetail(chap, tables){
  let html = `
    <div class="detail-header">
      <div class="detail-code">JTS276 · Level ${chap.level||''}</div>
      <div class="detail-name">${esc(chap.title || chap.subtitle || '(无题)')}</div>
      ${chap.subtitle && chap.title !== chap.subtitle ? `<div class="detail-name-en">${esc(chap.subtitle)}</div>` : ''}
      <div class="detail-meta"><span>子表 <strong>${tables.length}</strong></span></div>
    </div>`;
  if (tables.length === 0){
    html += `<div class="card mute">本章下无定额表（可能是父章，请展开子章）</div>`;
  } else {
    html += `<div class="section"><div class="section-title">章下定额表</div>`;
    for (const t of tables){
      const cnt = (POOL.jtsItemsByTable[`3:${t.id}`] || []).length;
      html += `<div class="card"><strong>${esc(t.section_title || '(未命名)')}</strong>${t.subsection_title ? ' · ' + esc(t.subsection_title) : ''}
        <div style="font-size:12px; color:var(--text-dim); margin-top:4px">单位 ${esc(t.unit||'-')} · 条目 ${cnt}</div></div>`;
    }
    html += `</div>`;
  }
  document.getElementById('detail').innerHTML = html;
}

function renderJtsTableDetail(table, items){
  let html = `
    <div class="detail-header">
      <div class="detail-code">JTS276 · table_id = ${table.id}</div>
      <div class="detail-name">${esc(table.section_title || '(未命名)')}</div>
      ${table.subsection_title ? `<div class="detail-name-en">${esc(table.subsection_title)}</div>` : ''}
      <div class="detail-meta"><span>单位 <strong>${esc(table.unit||'-')}</strong></span><span>条目 <strong>${items.length}</strong></span></div>
    </div>`;
  if (items.length === 0){
    html += `<div class="card mute">无条目</div>`;
  } else {
    html += `<div class="section"><div class="section-title">1D 长格式条目</div>
      <div class="card" style="padding:0"><table class="norm-table">
        <thead><tr>
          <th style="width:80px">编号</th><th style="width:100px">属性1</th><th style="width:100px">属性2</th>
          <th>费用项目</th><th style="width:60px">单位</th><th style="width:80px">数量</th>
        </tr></thead><tbody>`;
    for (const it of items.slice(0, 500)){
      html += `<tr>
        <td class="code-cell">${esc(it.norms_code)}</td>
        <td>${esc(it.a1||'')}</td>
        <td>${esc(it.a2||'')}</td>
        <td>${esc(it.cost_item)}</td>
        <td>${esc(it.unit||'')}</td>
        <td class="num">${fmt(it.amount)}</td>
      </tr>`;
    }
    html += `</tbody></table></div>`;
    if (items.length > 500){
      html += `<div class="card mute" style="margin-top:8px">仅显示前 500 条 · 共 ${items.length} 条</div>`;
    }
    html += `</div>`;
  }
  document.getElementById('detail').innerHTML = html;
}

// ============== utils ==============
function esc(s){
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function fmt(n){
  if (n === null || n === undefined || n === '') return '';
  const v = Number(n);
  if (!isFinite(v)) return '';
  if (v === 0) return '0';
  return v.toFixed(2);
}
