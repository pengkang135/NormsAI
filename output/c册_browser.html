<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C册 市政园林 - BJ21定额浏览</title>
<style>
:root {
  --bg: #f8f7f4; --sidebar-bg: #f0ede4; --card-bg: #ffffff;
  --border: #e0dbd0; --border-light: #eeebe2; --text: #2d2416;
  --text-dim: #8c8274; --text-faint: #b8af9e; --accent: #c75b39;
  --accent-light: #faf2ee; --code-bg: #faf7f2;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Microsoft YaHei', 'SimHei', -apple-system, sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; font-size: 14px; line-height: 1.5; }

.sidebar { width: 360px; min-width: 360px; background: var(--sidebar-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
.sidebar-header { padding: 14px 16px; border-bottom: 1px solid var(--border); }
.sidebar-header h2 { font-size: 16px; margin-bottom: 6px; }
.summary-stats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; font-size: 12px; color: var(--text-dim); }
.summary-stats span { white-space: nowrap; }
.search-box { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 4px; font-size: 13px; background: var(--card-bg); margin-top: 8px; }
.filter-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.filter-btn { padding: 3px 8px; border: 1px solid var(--border); border-radius: 3px; background: var(--card-bg); cursor: pointer; font-size: 11px; transition: all 0.15s; }
.filter-btn:hover { background: #e8e3d7; }
.filter-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
.chapter-tree { flex: 1; overflow-y: auto; padding: 4px 0; }
.chapter-item { padding: 5px 12px; cursor: pointer; border-left: 3px solid transparent; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: all 0.1s; }
.chapter-item:hover { background: #e8e3d7; }
.chapter-item.active { background: #e4dcd0; border-left-color: var(--accent); font-weight: bold; }
.chapter-item.l0 { padding-left: 12px; font-weight: bold; font-size: 14px; }
.chapter-item.l1 { padding-left: 24px; }
.chapter-item.l2 { padding-left: 36px; font-size: 12px; color: var(--text-dim); }
.chapter-item .cnt { float: right; font-size: 11px; color: var(--text-faint); }

.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.main-header { padding: 14px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); }
.main-header h3 { font-size: 16px; font-weight: normal; }
.norm-table { flex: 1; overflow-y: auto; padding: 0; }
.norm-table table { width: 100%; border-collapse: collapse; }
.norm-table th { position: sticky; top: 0; background: #f5f2eb; padding: 10px 14px; text-align: left; font-size: 12px; color: var(--text-dim); border-bottom: 2px solid var(--border); z-index: 1; }
.norm-table td { padding: 8px 14px; border-bottom: 1px solid var(--border-light); font-size: 13px; }
.norm-table tr:hover td { background: #fdfaf6; }
.spec-tag { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 11px; background: #e3edf5; color: #4a7c9b; }
.code-cell { font-family: 'Consolas', 'Courier New', monospace; font-weight: bold; color: var(--accent); white-space: nowrap; }
.empty-state { text-align: center; padding: 60px 20px; color: var(--text-dim); }
.empty-state p { margin-top: 8px; }
.pagination { display: flex; justify-content: center; align-items: center; gap: 12px; padding: 12px; border-top: 1px solid var(--border); background: var(--card-bg); font-size: 13px; }
.pagination button { padding: 6px 16px; border: 1px solid var(--border); border-radius: 4px; background: var(--card-bg); cursor: pointer; }
.pagination button:hover { background: #f0ece2; }
.pagination button:disabled { opacity: 0.4; cursor: default; }
</style>
</head>
<body>
<div class="sidebar">
  <div class="sidebar-header">
    <h2>C册 市政园林</h2>
    <div class="summary-stats" id="summaryStats">
      <span id="statTotal">定额: -</span>
    </div>
    <input class="search-box" id="search" placeholder="搜索定额编号或名称 (回车)">
    <div class="filter-row" id="filterRow">
      <button class="filter-btn active" data-filter="all">全部</button>
    </div>
  </div>
  <div class="chapter-tree" id="tree"><div style="padding:20px;color:var(--text-dim)">加载中...</div></div>
</div>
<div class="main">
  <div class="main-header">
    <h3 id="mainTitle">BJ21 定额浏览</h3>
    <span style="font-size:13px;color:var(--text-dim)" id="resultCount"></span>
  </div>
  <div class="norm-table" id="normTable">
    <div class="empty-state"><p>从左侧选择一个章节查看定额</p></div>
  </div>
  <div class="pagination" id="pagination" style="display:none">
    <button onclick="prevPage()">上一页</button>
    <span id="pageInfo">第 1 页</span>
    <button onclick="nextPage()">下一页</button>
  </div>
</div>

<script>
let DATA = null;
let currentFilter = 'all';
let currentChapter = null;
let currentNorms = [];
let page = 0;
const PAGE_SIZE = 50;
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

async function init() {
  try {
    const res = await fetch('c册_browser_data.json');
    DATA = await res.json();
    document.getElementById('statTotal').textContent = `定额: ${DATA.total_norms}`;

    // Dynamic specialty stats
    const statsDiv = document.getElementById('summaryStats');
    const topSpecs = Object.entries(DATA.specialty_stats)
      .sort((a, b) => b[1] - a[1]).slice(0, 4);
    topSpecs.forEach(([spec, cnt]) => {
      const span = document.createElement('span');
      span.textContent = `${spec}: ${cnt}`;
      statsDiv.appendChild(span);
    });

    // Dynamic filter buttons
    const filterRow = document.getElementById('filterRow');
    const specs = Object.keys(DATA.specialty_stats).sort();
    specs.forEach(spec => {
      const btn = document.createElement('button');
      btn.className = 'filter-btn';
      btn.textContent = spec;
      btn.setAttribute('data-filter', spec);
      btn.onclick = () => setFilter(spec);
      filterRow.appendChild(btn);
    });

    buildTree();
  } catch(e) {
    document.getElementById('tree').innerHTML = `<div style="padding:20px;color:var(--accent)">加载失败: ${e.message}</div>`;
  }
}

function buildTree() {
  const chById = {};
  DATA.chapters.forEach(ch => { chById[ch.id] = ch; });

  const childrenByPid = {};
  DATA.chapters.forEach(ch => {
    if (!childrenByPid[ch.pid]) childrenByPid[ch.pid] = [];
    childrenByPid[ch.pid].push(ch);
  });

  // Only show chapters that have norms (or are ancestors of those)
  const chaptersWithNorms = new Set();
  for (const [cid, cnt] of Object.entries(DATA.chap_norm_count)) {
    if (cnt > 0) {
      chaptersWithNorms.add(parseInt(cid));
      let cur = chById[parseInt(cid)];
      while (cur && cur.pid) {
        chaptersWithNorms.add(cur.pid);
        cur = chById[cur.pid];
      }
    }
  }

  const tree = document.getElementById('tree');
  tree.innerHTML = '';

  function renderChildren(pid, level) {
    const children = (childrenByPid[pid] || []).filter(ch => chaptersWithNorms.has(ch.id));
    children.sort((a, b) => a.code.localeCompare(b.code));
    children.forEach(ch => {
      const cnt = DATA.chap_norm_count[ch.id] || 0;
      const div = document.createElement('div');
      div.className = `chapter-item l${Math.min(level, 2)}`;
      const displayName = (ch.name || '').length > 30 ? (ch.name || '').substring(0, 28) + '..' : (ch.name || '');
      div.innerHTML = `<span>C.${esc(ch.code)} ${esc(displayName)}</span>${cnt > 0 ? `<span class="cnt">${cnt}</span>` : ''}`;
      div.onclick = (e) => { e.stopPropagation(); selectChapter(ch.id); };
      tree.appendChild(div);
      renderChildren(ch.id, level + 1);
    });
  }

  renderChildren(0, 0);
}

function getDescendantCodes(cid) {
  const codes = [];
  const ch = DATA.chapters.find(c => c.id === cid);
  if (ch) codes.push(ch.code);
  DATA.chapters.filter(c => c.pid === cid).forEach(child => {
    getDescendantCodes(child.id).forEach(cc => codes.push(cc));
  });
  return codes;
}

function selectChapter(chapterId) {
  currentChapter = chapterId;
  searchResults = null;
  page = 0;

  // Highlight active
  document.querySelectorAll('.chapter-item').forEach(el => el.classList.remove('active'));
  event && event.target && event.target.closest('.chapter-item') && event.target.closest('.chapter-item').classList.add('active');

  const ch = DATA.chapters.find(c => c.id === chapterId);
  if (!ch) return;

  document.getElementById('mainTitle').textContent = `C.${ch.code} ${ch.name}`;

  // Collect descendant chapter codes
  const allCodes = getDescendantCodes(chapterId);

  // Find matching norms
  let matching = DATA.norms_sample.filter(n => allCodes.includes(n.chap_code));
  if (currentFilter !== 'all') {
    matching = matching.filter(n => n.specialty === currentFilter);
  }

  const totalCnt = DATA.chap_norm_count[chapterId] || 0;
  if (matching.length > 0) {
    currentNorms = matching;
    page = 0;
    renderPage();
  } else if (totalCnt > 0) {
    document.getElementById('normTable').innerHTML = `
      <div class="empty-state">
        <p>该章节有 ${totalCnt} 条定额</p>
        <p style="font-size:12px">（示例数据仅包含前500条，请在搜索框中输入定额编号查找）</p>
      </div>`;
    document.getElementById('resultCount').textContent = `${totalCnt} 条`;
    document.getElementById('pagination').style.display = 'none';
  } else {
    document.getElementById('normTable').innerHTML =
      '<div class="empty-state"><p>该章节下无定额（点击子章节查看）</p></div>';
    document.getElementById('resultCount').textContent = '';
    document.getElementById('pagination').style.display = 'none';
  }
}

function renderPage() {
  const start = page * PAGE_SIZE;
  const end = start + PAGE_SIZE;
  const pageNorms = currentNorms.slice(start, end);
  const totalPages = Math.ceil(currentNorms.length / PAGE_SIZE);

  document.getElementById('normTable').innerHTML = `
    <table>
      <thead><tr>
        <th style="width:130px">定额编号</th>
        <th>名称</th>
        <th style="width:60px">专业</th>
        <th style="width:60px">单位</th>
        <th style="width:140px">所属章节</th>
      </tr></thead>
      <tbody>
        ${pageNorms.map(n => `
          <tr>
            <td class="code-cell">${esc(n.code)}</td>
            <td>${esc(n.name)}</td>
            <td><span class="spec-tag">${esc(n.specialty)}</span></td>
            <td>${esc(n.unit || '-')}</td>
            <td style="font-size:12px;color:var(--text-dim)">${esc(n.chap_code)}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>`;

  document.getElementById('resultCount').textContent = `共 ${currentNorms.length} 条`;
  document.getElementById('pageInfo').textContent = `第 ${page + 1}/${Math.max(1, totalPages)} 页`;
  document.getElementById('pagination').style.display = currentNorms.length > PAGE_SIZE ? 'flex' : 'none';
}

function prevPage() { if (page > 0) { page--; renderPage(); } }
function nextPage() { const tp = Math.ceil(currentNorms.length / PAGE_SIZE); if (page < tp - 1) { page++; renderPage(); } }

function setFilter(filter) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  const target = document.querySelector(`.filter-btn[data-filter="${filter}"]`);
  if (target) target.classList.add('active');
  if (searchResults) doSearch(document.getElementById('search').value);
  else if (currentChapter) selectChapter(currentChapter);
}

document.getElementById('search').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doSearch(this.value);
});

async function doSearch(q) {
  if (!q.trim()) return;
  const ql = q.toLowerCase();

  document.getElementById('mainTitle').textContent = `搜索: ${q}`;
  document.getElementById('normTable').innerHTML = '<div class="empty-state"><p>搜索中...</p></div>';

  try {
    let results = DATA.norms_sample.filter(n =>
      n.code.toLowerCase().includes(ql) || n.name.includes(q)
    );

    if (currentFilter !== 'all') {
      results = results.filter(n => n.specialty === currentFilter);
    }

    if (results.length === 0) {
      document.getElementById('normTable').innerHTML = `
        <div class="empty-state">
          <p>在示例数据中未找到匹配 "${esc(q)}" 的定额</p>
          <p style="font-size:12px">提示: 数据库中共有 ${DATA.total_norms} 条定额。建议通过章节树浏览</p>
        </div>`;
      document.getElementById('resultCount').textContent = '';
      document.getElementById('pagination').style.display = 'none';
    } else {
      searchResults = results;
      currentNorms = results;
      page = 0;
      renderPage();
    }
  } catch(e) {
    document.getElementById('normTable').innerHTML = `<div class="empty-state"><p>搜索出错: ${e.message}</p></div>`;
  }
}

init();
</script>
</body>
</html>
