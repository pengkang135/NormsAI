// 机械台班定额详情：上=费用组成主表（子目行×费用列，同别的定额库主表），下=定额消耗量子目对比表（子目列×消耗行）
function renderMachineShift(ch, tablesData, main, header) {
  const uid = 'ms';
  const COST_DEFAULT = ['单价', '折旧费', '大修费', '经修费', '安拆及场外运费费', '人工费', '燃料动力费', '其他'];
  const USAGE_DEFAULT = ['人工', '汽油', '柴油', '电', '煤', '木柴', '水'];
  const COST_UNIT = { '单价': '元/台班', '折旧费': '元', '大修费': '元', '经修费': '元', '安拆及场外运费费': '元', '人工费': '元', '燃料动力费': '元', '其他': '元' };
  const USAGE_UNIT = { '人工': '工日', '汽油': 'L', '柴油': 'L', '电': 'kWh', '煤': 'kg', '木柴': 'kg', '水': 't' };

  const h = tablesData[0]?.header || {};
  const costCols = (h.cost_composition && h.cost_composition.length) ? h.cost_composition : COST_DEFAULT;
  const usageCols = (h.consumption && h.consumption.length) ? h.consumption : USAGE_DEFAULT;

  // 子目：code -> 名称 + 费用/消耗各项金额
  const codeMap = new Map();
  const unitMap = {};
  for (const td of tablesData) {
    for (const it of td.items) {
      const code = it.norms_code;
      if (!code) continue;
      if (!codeMap.has(code)) codeMap.set(code, { name: '', cost: {}, usage: {} });
      const g = codeMap.get(code);
      if (it.amount == null) g.name = it.cost_item || '';
      else if (costCols.includes(it.cost_item)) g.cost[it.cost_item] = it.amount;
      else if (usageCols.includes(it.cost_item)) g.usage[it.cost_item] = it.amount;
      if (it.cost_item && it.cost_item_unit && !unitMap[it.cost_item]) unitMap[it.cost_item] = it.cost_item_unit;
    }
  }
  const codes = [...codeMap.keys()].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));

  const parent = (INDEX.chapters || []).find(c => c.id === ch.parent_id);
  const parentTitle = parent ? (T(parent.title, parent.title_en) || '') : '';
  header.innerHTML = '<div class="breadcrumb">' + (parentTitle ? escHtml(parentTitle) + ' <span style="color:var(--text-faint)">&rsaquo;</span> ' : '')
    + '<span class="current">' + escHtml(T(ch.title, ch.title_en) || '') + '</span></div>'
    + '<div class="stats"><span><strong>' + codes.length + '</strong> ' + t('records') + '</span>'
    + '<span>' + t('unit') + ': <strong>台班</strong></span></div>';

  let html = '<div class="boq-group-summary"><span class="sum-stat"><strong>' + codes.length + '</strong> ' + t('norms_items') + '</span></div>';

  // 费用组成主表：子目做行，费用项做列（表头 = 8 项费用）
  const exportable = canExport(currentDocKey);
  html += '<div class="boq-master-table-wrap"><table class="boq-master-table"><thead><tr>';
  if (exportable) {
    html += '<th class="col-sel"><input type="checkbox" title="' + t('select_all_hint') + '" onclick="toggleSelectAll(event, this)"></th>';
  }
  html += '<th class="col-code">' + t('quota_code') + '</th>';
  html += '<th class="col-name">' + t('item_name') + '</th>';
  for (const c of costCols) html += '<th class="col-num">' + escHtml(c) + '<div class="th-unit">' + escHtml(unitMap[c] || COST_UNIT[c] || '') + '</div></th>';
  html += '</tr></thead><tbody>';
  for (let i = 0; i < codes.length; i++) {
    const code = codes[i];
    const g = codeMap.get(code);
    html += '<tr class="boq-master-row" id="boq-mrow-' + uid + i + '"'
         + ' data-doc="' + escHtml(currentDocKey) + '" data-code="' + escHtml(code) + '"'
         + ' data-name="' + escHtml(g.name) + '" data-unit="台班"'
         + ' onclick="onMasterRowClick(event,' + i + ',' + codes.length + ',\'' + uid + '\')">';
    if (exportable) {
      html += '<td class="col-sel"><input type="checkbox" onclick="onRowCheckbox(event, this)"></td>';
    }
    html += '<td class="col-code">' + escHtml(code) + '</td>';
    html += '<td class="col-name">' + escHtml(g.name) + '</td>';
    for (const c of costCols) {
      const v = g.cost[c];
      html += '<td class="col-num' + (v == null ? ' is-nil' : '') + '">' + (v != null ? fmtMoney(v) : '-') + '</td>';
    }
    html += '</tr>';
  }
  html += '</tbody></table></div>';

  // 定额消耗量子目对比表：子目做列，费用组成 + 消耗量做行，单位列右边加单价列（消耗项取费单价）
  const priceMap = h.consumption_price || {};
  const rows = [];
  for (const c of costCols) {
    if (c === '单价') continue;
    rows.push({ name: c, kind: 'cost', unit: unitMap[c] || COST_UNIT[c] || '' });
  }
  for (const c of usageCols) rows.push({ name: c, kind: 'usage', unit: unitMap[c] || USAGE_UNIT[c] || '' });
  html += '<div class="boq-compare-section">';
  html += '<div class="boq-compare-title">' + t('consumption') + '</div>';
  html += '<div class="boq-compare-wrap"><table class="boq-compare-table" id="boqCompareTable' + uid + '"><thead><tr>';
  html += '<th class="ch-seq">' + t('seq') + '</th>';
  html += '<th class="ch-item">' + t('item') + '</th>';
  html += '<th class="ch-unit">' + t('unit') + '</th>';
  html += '<th class="ch-price">' + t('price') + '</th>';
  for (let ci = 0; ci < codes.length; ci++) {
    html += '<th class="ch-code-col" data-col="' + ci + '" title="' + escHtml(codeMap.get(codes[ci]).name) + '" onclick="highlightCompareCol(' + ci + ',' + codes.length + ',\'' + uid + '\')">' + escHtml(codes[ci]) + '</th>';
  }
  html += '</tr></thead><tbody>';
  for (let ri = 0; ri < rows.length; ri++) {
    const row = rows[ri];
    const price = row.kind === 'usage' && priceMap[row.name] != null ? fmtMoney(priceMap[row.name]) : '';
    html += '<tr>';
    html += '<td class="cc-seq">' + (ri + 1) + '</td>';
    html += '<td class="cc-item" title="' + escHtml(row.name) + '">' + escHtml(row.name) + '</td>';
    html += '<td class="cc-unit">' + escHtml(row.unit) + '</td>';
    html += '<td class="cc-price">' + price + '</td>';
    for (let ci = 0; ci < codes.length; ci++) {
      const v = row.kind === 'cost' ? codeMap.get(codes[ci]).cost[row.name] : codeMap.get(codes[ci]).usage[row.name];
      const fv = v == null ? null : (row.kind === 'cost' ? fmtMoney(v) : fmtQty(v, row.unit));
      html += fv != null ? '<td class="cc-val" data-col="' + ci + '">' + fv + '</td>'
                        : '<td class="cc-empty" data-col="' + ci + '">-</td>';
    }
    html += '</tr>';
  }
  html += '</tbody></table></div></div>';

  main.innerHTML = html;
  syncMasterCheckboxes();
  renderSelDock();
}

function renderMixMaterials(tablesData, main) {
  let html = '<div class="detail-card-list">';

  for (const td of tablesData) {
    const tbl = td.table;
    const items = td.items || [];
    const h = td.header || {};
    const name = T(tbl.subsection_title, tbl.subsection_title_en) || T(tbl.section_title, tbl.section_title_en) || '';
    const unit = h.unit || tbl.unit || '';
    const rate = h.rate != null ? h.rate : null;
    const labour = h.labour != null ? h.labour : null;
    const materials = h.materials != null ? h.materials : null;
    const mech = h.mech != null ? h.mech : null;
    const resources = h.resources || [];

    // Build unit-price lookup from resource definitions
    const unitPrices = {};
    for (const r of resources) {
      unitPrices[r.name] = r.unit_price || 0;
    }

    html += '<div class="detail-card">';
    html += '<div class="detail-card-hd">';
    html += '<div class="detail-card-top">';
    html += '<div><span class="detail-card-name">' + escHtml(name) + '</span>';
    if (unit) html += '<span class="detail-card-unit" style="margin-left:8px">' + escHtml(unit) + '</span>';
    html += '</div>';
    html += '<span class="detail-card-rate">' + (fmtMoney(rate) != null ? fmtMoney(rate) : '') + '</span>';
    html += '</div>';
    html += '</div>';

    html += '<div class="detail-card-bd">';
    // Cost summary bar
    html += '<div class="detail-cost-bar">';
    html += '<div><div class="cost-k">' + t('labour_cost') + '</div><div class="cost-v">' + (fmtMoney(labour) != null ? fmtMoney(labour) : '-') + '</div></div>';
    html += '<div><div class="cost-k">' + t('material_cost') + '</div><div class="cost-v">' + (fmtMoney(materials) != null ? fmtMoney(materials) : '-') + '</div></div>';
    html += '<div><div class="cost-k">' + t('machine_cost') + '</div><div class="cost-v">' + (fmtMoney(mech) != null ? fmtMoney(mech) : '-') + '</div></div>';
    html += '</div>';

    // Consumption table
    if (items.length > 0) {
      html += '<table class="detail-consumption-table"><thead><tr>';
      html += '<th class="seq">' + t('seq') + '</th><th>' + t('item') + '</th><th>' + t('unit') + '</th><th>' + t('price') + '</th><th>' + t('consumption') + '</th>';
      html += '</tr></thead><tbody>';
      let seq = 0;
      for (const it of items) {
        seq++;
        const up = unitPrices[it.cost_item] || null;
        html += '<tr>';
        html += '<td class="seq">' + seq + '</td>';
        html += '<td class="i-name">' + escHtml(T(it.cost_item, it.cost_item_en) || '') + '</td>';
        html += '<td class="i-unit">' + escHtml(T(it.cost_item_unit, it.cost_item_unit_en) || '') + '</td>';
        html += '<td class="i-price">' + (up != null ? fmtMoney(up) : '') + '</td>';
        html += '<td class="i-qty">' + (fmtQty(it.amount, it.cost_item_unit) != null ? fmtQty(it.amount, it.cost_item_unit) : '') + '</td>';
        html += '</tr>';
      }
      html += '</tbody></table>';
    }

    html += '</div></div>';
  }

  html += '</div>';
  main.innerHTML = html;
}

function renderBOQGroup(tablesData, main, uid = '') {
  const costLabels = new Set(['人工费', '材料费', '机械费', '基价']);

  // 混凝土构件（MB 前缀）：注入「构件名」名称行，使其走主表子目列表 + 定额消耗量对比表
  for (const td of tablesData) {
    if (!td.items || !td.items.some(it => (it.norms_code || '').startsWith('MB'))) continue;
    const nameRows = [];
    const seenCodes = new Set();
    for (const it of td.items) {
      const code = it.norms_code;
      if (!code || seenCodes.has(code)) continue;
      seenCodes.add(code);
      nameRows.push({
        norms_code: code,
        attr_level1: it.attr_level1, attr1_label: it.attr1_label,
        attr_level2: it.attr_level2, attr2_label: it.attr2_label,
        attr_level3: it.attr_level3, attr3_label: it.attr3_label,
        attr_level4: it.attr_level4, attr4_label: it.attr4_label,
        cost_item: (it.attr_level1 || code) + (it.attr_level2 ? ' ' + it.attr_level2 : ''),
        cost_item_unit: td.table.unit || '',
        amount: null,
      });
    }
    td.items = nameRows.concat(td.items);
  }

  // Group items by norms_code
  const codeMap = new Map();
  for (const td of tablesData) {
    const tUnit = td.table.unit || '';
    const mainUnits = tUnit.split(/,\s*/).filter(Boolean);
    for (const it of td.items) {
      const code = it.norms_code;
      if (!code) continue;
      // enterprise_item 清单项已在左侧导航呈现，详情表只列定额子目
      if (it.attr1_label === '清单项目') continue;
      if (!codeMap.has(code)) {
        codeMap.set(code, { rows: [], mainUnits: mainUnits, normId: null });
      }
      const g = codeMap.get(code);
      if (g.normId == null && it.norm_id != null) g.normId = it.norm_id;
      g.rows.push(it);
    }
  }

  // Build result for each code
  const results = [];
  for (const [code, group] of codeMap) {
    let nameRow = null, labourAmt = null, matAmt = null, mechAmt = null;
    const resourceRows = [];
    let workContent = '', typeLabel = '';

    for (const r of group.rows) {
      if (r.cost_item === '人工费') { labourAmt = r.amount; continue; }
      if (r.cost_item === '材料费') { matAmt = r.amount; continue; }
      if (r.cost_item === '机械费') { mechAmt = r.amount; continue; }
      if (r.attr_level1) typeLabel = r.attr_level1;
      if (r.attr_level3) workContent = r.attr_level3;
    }

    for (const r of group.rows) {
      if (costLabels.has(r.cost_item)) continue;
      if (r.cost_item_unit !== '元' && group.mainUnits.includes(r.cost_item_unit)) {
        nameRow = r; break;
      }
    }
    if (!nameRow) {
      for (const r of group.rows) {
        if (!costLabels.has(r.cost_item) && r.cost_item_unit !== '元') { nameRow = r; break; }
      }
    }
    if (!nameRow) {
      for (const r of group.rows) {
        if (!costLabels.has(r.cost_item)) { nameRow = r; break; }
      }
    }
    if (!nameRow && group.rows.length > 0) nameRow = group.rows[0];
    if (!nameRow) continue;

    for (const r of group.rows) {
      if (r === nameRow) continue;
      if (costLabels.has(r.cost_item)) continue;
      resourceRows.push(r);
    }

    let rate = nameRow.cost_item_unit !== '元' ? nameRow.amount : null;
    if (code.startsWith('MB')) {
      rate = 0;
      labourAmt = 0;
      matAmt = 0;
      mechAmt = 0;
      for (const r of resourceRows) {
        if (r.amount == null || r.unit_price == null) continue;
        rate += r.amount * r.unit_price;
        if (r.man_price != null) labourAmt += r.amount * r.man_price;
        if (r.material_price != null) matAmt += r.amount * r.material_price;
        if (r.machine_price != null) mechAmt += r.amount * r.machine_price;
      }
    }

    results.push({
      code, normId: group.normId,
      name: nameRow.cost_item || code,
      name_en: nameRow.cost_item_en || '',
      unit: nameRow.cost_item_unit || '',
      rate: rate,
      type: typeLabel, work_content: workContent,
      labour: labourAmt, materials: matAmt, mech: mechAmt,
      resources: resourceRows
    });
  }

  results.sort((a, b) => a.code.localeCompare(b.code, undefined, {numeric: true}));

  if (results.length === 0) {
    main.innerHTML = '<div class="placeholder"><div class="icon">&#128218;</div><div>' + t('no_chapter_data') + '</div></div>';
    renderSelDock();
    return;
  }

  // ── Render Master Table ──
  let html = '<div class="boq-group-summary">';
  html += '<span class="sum-stat"><strong>' + results.length + '</strong> ' + t('norms_items') + '</span>';
  html += '</div>';

  html += '<div class="boq-master-table-wrap">';
  html += '<table class="boq-master-table"><thead><tr>';
  const exportable = canExport(currentDocKey);
  if (exportable) {
    html += '<th class="col-sel"><input type="checkbox" title="' + t('select_all_hint') + '" onclick="toggleSelectAll(event, this)"></th>';
  }
  html += '<th class="col-code">' + t('quota_code') + '</th>';
  html += '<th class="col-name">' + t('item_name') + '</th>';
  html += '<th class="col-unit">' + t('unit') + '</th>';
  html += '<th class="col-num">' + priceHeader() + '</th>';
  html += '<th class="col-num">' + t('labour_cost') + '</th>';
  html += '<th class="col-num">' + t('material_cost') + '</th>';
  html += '<th class="col-num">' + t('machine_cost') + '</th>';
  html += '</tr></thead><tbody>';

  for (let i = 0; i < results.length; i++) {
    const it = results[i];
    html += '<tr class="boq-master-row" id="boq-mrow-' + uid + i + '"'
         + ' data-doc="' + escHtml(currentDocKey) + '" data-code="' + escHtml(it.code) + '"'
         + (it.normId != null ? ' data-norm-id="' + it.normId + '"' : '')
         + ' data-name="' + escHtml(it.name) + '" data-unit="' + escHtml(it.unit) + '"'
         + ' onclick="onMasterRowClick(event,' + i + ',' + results.length + ',\'' + uid + '\')">';
    if (exportable) {
      const selectable = it.normId != null || DOCS_WITHOUT_NORM_ID.has(currentDocKey);
      html += '<td class="col-sel">'
           + (selectable ? '<input type="checkbox" onclick="onRowCheckbox(event, this)">' : '')
           + '</td>';
    }
    html += '<td class="col-code">' + escHtml(it.code) + '</td>';
    html += '<td class="col-name">' + escHtml(T(it.name, it.name_en)) + '</td>';
    html += '<td class="col-unit">' + escHtml(it.unit) + '</td>';
    html += '<td class="col-num">' + (it.rate != null ? fmtMoney(cur(it.rate)) : '-') + '</td>';
    html += '<td class="col-num' + (it.labour == null ? ' is-nil' : '') + '">' + (it.labour != null ? fmtMoney(cur(it.labour)) : '-') + '</td>';
    html += '<td class="col-num' + (it.materials == null ? ' is-nil' : '') + '">' + (it.materials != null ? fmtMoney(cur(it.materials)) : '-') + '</td>';
    html += '<td class="col-num' + (it.mech == null ? ' is-nil' : '') + '">' + (it.mech != null ? fmtMoney(cur(it.mech)) : '-') + '</td>';
    html += '</tr>';
  }

  html += '</tbody></table></div>';

  // ── Comparison Table: all resources across all codes ──
  // Collect unique resources: key = "name|unit", preserve order of first appearance
  const resKeySet = new Set();
  const resList = [];
  for (const it of results) {
    for (const r of it.resources) {
      const key = r.cost_item + '|' + r.cost_item_unit;
      if (!resKeySet.has(key)) {
        resKeySet.add(key);
        resList.push({ name: r.cost_item, name_en: r.cost_item_en || '', unit: r.cost_item_unit, unit_en: r.cost_item_unit_en || '', unit_price: r.unit_price });
      }
    }
  }

  if (resList.length > 0) {
    // Build lookup: resKey -> code -> amount
    const amountMap = {};
    for (const key of resKeySet) { amountMap[key] = {}; }
    for (const it of results) {
      for (const r of it.resources) {
        const key = r.cost_item + '|' + r.cost_item_unit;
        amountMap[key][it.code] = r.amount;
      }
    }

    html += '<div class="boq-compare-section">';
    html += '<div class="boq-compare-title">' + t('compare_title') + '</div>';
    html += '<div class="boq-compare-wrap">';
    html += '<table class="boq-compare-table" id="boqCompareTable' + uid + '"><thead><tr>';
    html += '<th class="ch-seq">' + t('seq') + '</th>';
    html += '<th class="ch-item">' + t('item') + '</th>';
    html += '<th class="ch-unit">' + t('unit') + '</th>';
    html += '<th class="ch-price">' + t('price') + '</th>';
    for (let ci = 0; ci < results.length; ci++) {
      const rcName = T(results[ci].name, results[ci].name_en);
      html += '<th class="ch-code-col" data-col="' + ci + '" title="' + escHtml(rcName) + '" onclick="highlightCompareCol(' + ci + ',' + results.length + ',\'' + uid + '\')">' + escHtml(results[ci].code) + '</th>';
    }
    html += '</tr></thead><tbody>';

    for (let ri = 0; ri < resList.length; ri++) {
      const res = resList[ri];
      const key = res.name + '|' + res.unit;
      const resName = T(res.name, res.name_en);
      html += '<tr>';
      html += '<td class="cc-seq">' + (ri + 1) + '</td>';
      html += '<td class="cc-item" title="' + escHtml(resName) + '">' + escHtml(resName) + '</td>';
      html += '<td class="cc-unit">' + escHtml(T(res.unit, res.unit_en) || '') + '</td>';
      html += '<td class="cc-price">' + (res.unit_price != null ? fmtMoney(cur(res.unit_price)) : '') + '</td>';
      for (let ci = 0; ci < results.length; ci++) {
        const amt = amountMap[key][results[ci].code];
        if (amt != null) {
          html += '<td class="cc-val" data-col="' + ci + '">' + fmtQty(amt, res.unit) + '</td>';
        } else {
          html += '<td class="cc-empty" data-col="' + ci + '">-</td>';
        }
      }
      html += '</tr>';
    }

    html += '</tbody></table></div></div>';
  }

  main.innerHTML = html;
  syncMasterCheckboxes();
  renderSelDock();
}

function highlightCompareCol(colIdx, totalCols, uid = '') {
  const table = document.getElementById('boqCompareTable' + uid);
  const highlightClass = 'col-highlight';

  // Check if this column is already highlighted
  const testCell = table ? table.querySelector('td[data-col="' + colIdx + '"]') : null;
  const isActive = testCell && testCell.classList.contains(highlightClass);

  // Clear all highlights
  if (table) {
    table.querySelectorAll('.' + highlightClass).forEach(el => el.classList.remove(highlightClass));
  }
  document.querySelectorAll('.boq-master-row.row-highlight').forEach(el => el.classList.remove('row-highlight'));

  // If was active, just deactivate (toggle off)
  if (isActive) return;

  // Highlight the column in comparison table
  if (table) {
    table.querySelectorAll('[data-col="' + colIdx + '"]').forEach(el => el.classList.add(highlightClass));
  }

  // Highlight the master row
  const mrow = document.getElementById('boq-mrow-' + uid + colIdx);
  if (mrow) mrow.classList.add('row-highlight');

  // 将该定额列水平滚动到（非冻结区）中间
  scrollCompareToCol(colIdx, uid);
}

// 冻结列总宽 = 序号34 + 项目120 + 单位48（机械台班多一列单价60）
const COMPARE_FROZEN_W = 34 + 120 + 48;
function compareFrozenW(table) {
  return table && table.querySelector('th.ch-price') ? 34 + 200 + 48 + 60 : COMPARE_FROZEN_W;
}
function scrollCompareToCol(colIdx, uid = '') {
  const table = document.getElementById('boqCompareTable' + uid);
  const wrap = table ? table.closest('.boq-compare-wrap') : null;
  const th = wrap && wrap.querySelector('th[data-col="' + colIdx + '"]');
  if (!wrap || !th) return;
  const frozenW = compareFrozenW(table);
  // 列在内容坐标系中的左偏移（不依赖 offsetParent）
  const colLeftInContent = th.getBoundingClientRect().left - wrap.getBoundingClientRect().left + wrap.scrollLeft;
  const viewport = wrap.clientWidth - frozenW;      // 可视非冻结区宽度
  const target = colLeftInContent - frozenW - (viewport - th.offsetWidth) / 2;
  wrap.scrollTo({ left: Math.max(0, target), behavior: 'smooth' });
}

let searchTimer = null;

function onCodeSearch(e) {
  if (e && e.isComposing) return;   // 输入法组字期间不搜，避免拼音串触发全库扫描
  clearTimeout(searchTimer);
  searchTimer = setTimeout(runCodeSearch, 200);
}

function runCodeSearch() {
  const q = document.getElementById('codeSearch').value.trim();
  if (!q || !INDEX) return;

  const main = document.getElementById('mainContent');
  const header = document.getElementById('mainHeader');

  // Exact code match via code_index (supports SGA10012, 1-1, SGB004, etc.)
  if (/^[A-Za-z\d]+([-.][A-Za-z\d]+)*$/.test(q)) {
    findTableByCode(q, main, header, q);
    return;
  }

  textSearch(q, main, header);
}

// Text search: search norm names + codes at individual norm level
function textSearch(q, main, header) {
  const results = [];
  const qLower = q.toLowerCase();
  const normList = INDEX.norm_list;

  if (normList && normList.length > 0) {
    const tableById = {};
    for (const t of (INDEX.tables || [])) {
      tableById[t.id] = t;
    }
    for (const norm of normList) {
      if ((norm.name || '').toLowerCase().includes(qLower) || (norm.code || '').toLowerCase().includes(qLower)) {
        const table = tableById[norm.chap_id];
        if (table) {
          results.push({
            code: norm.code,
            name: norm.name,
            chap_id: norm.chap_id,
            table: table,
          });
        }
      }
      if (results.length >= 100) break;
    }
  } else {
    // Fallback: search table titles for non-Beijing databases
    for (const t of (INDEX.tables || [])) {
      const title = (t.section_title || '') + ' ' + (t.subsection_title || '') + ' ' + (t.work_content || '') + ' ' + (t.chapter_title || '')
        + ' ' + (t.section_title_en || '') + ' ' + (t.subsection_title_en || '') + ' ' + (t.chapter_title_en || '')
        + ' ' + (t._norm_names || '');
      if (title.toLowerCase().includes(qLower)) {
        results.push(t);
      }
    }
  }

  if (results.length === 0) {
    header.innerHTML = '<div class="breadcrumb"><span class="current">' + t('search_results') + '</span></div><div class="stats"></div>';
    main.innerHTML = '<div class="placeholder"><div class="icon">&#128270;</div><div>' + t('no_match') + ' "' + escHtml(q) + '"</div></div>';
    return;
  }

  if (normList && normList.length > 0) {
    showNormSearchResults(results, q, header, main);
  } else {
    showSearchResults(results, q, header, main);
  }
}

function findTableByCode(code, main, header, originalQ) {
  const codeIdx = INDEX.code_index;
  if (codeIdx && codeIdx[code]) {
    const tids = Array.isArray(codeIdx[code]) ? codeIdx[code] : [codeIdx[code]];

    const matched = (INDEX.tables || []).filter(t => tids.includes(t.id));
    if (matched.length === 1) {
      navigateToTable(matched[0], code);
    } else if (matched.length > 1) {
      showSearchResults(matched, originalQ, header, main);
    }
    return;
  }

  // Prefix search on code_index (e.g. "BJ21" matches "BJ21.1-1")
  if (codeIdx) {
    const matchTids = new Set();
    for (const [c, tids] of Object.entries(codeIdx)) {
      if (c.startsWith(code)) {
        const arr = Array.isArray(tids) ? tids : [tids];
        arr.forEach(tid => matchTids.add(tid));
      }
    }
    if (matchTids.size > 0) {
      const matched = (INDEX.tables || []).filter(t => matchTids.has(t.id));
      if (matched.length > 0) {
        showSearchResults(matched, originalQ, header, main);
        return;
      }
    }
  }

  // code_index 可用时，编号已确定不存在，转文本搜索，不再逐表 fetch 扫描
  if (codeIdx && Object.keys(codeIdx).length > 0) {
    textSearch(originalQ, main, header);
    return;
  }

  // Fallback: scan all table files
  header.innerHTML = '<div class="breadcrumb"><span class="current">' + t('search') + ': ' + escHtml(originalQ) + '</span></div><div class="stats"><span>' + t('finding_code') + ' <strong>' + code + '</strong>...</span></div>';
  main.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-faint)">' + t('searching') + '</div>';

  (async () => {
    for (const tbl of (INDEX.tables || [])) {
      try {
        const r = await fetch('/api/items?doc=' + encodeURIComponent(currentDocKey) + '&table_id=' + tbl.id);
        if (!r.ok) continue;
        const items = await r.json();
        for (const it of items) {
          if (it.norms_code === code) {
            header.innerHTML = '<div class="breadcrumb">' + t('search') + ': <span class="current">' + escHtml(originalQ) + '</span></div>';
            window._initialCode = code;
            navigateToTable(tbl, code);
            return;
          }
        }
      } catch (e) {}
    }
    header.innerHTML = '<div class="breadcrumb"><span class="current">' + t('search_results') + '</span></div><div class="stats"></div>';
    main.innerHTML = '<div class="placeholder"><div class="icon">&#128270;</div><div>' + t('code_not_found') + ' "' + escHtml(originalQ) + '"</div></div>';
  })();
}

function showNormSearchResults(results, q, header, main) {
  header.innerHTML = '<div class="breadcrumb">' + t('search_results') + ': <span class="current">' + escHtml(q) + '</span></div><div class="stats"><span><strong>' + results.length + '</strong> ' + (LANG === 'en' ? 'matches' : '个匹配') + '</span></div>';

  let html = '';
  for (const r of results) {
    const cname = T(r.table.subsection_title, r.table.subsection_title_en) || T(r.table.chapter_title, r.table.chapter_title_en) || '';
    html += '<div class="table-card" style="cursor:pointer" data-norm-code="' + escHtml(r.code) + '" data-norm-chapid="' + r.chap_id + '" data-click-action="norm-search-result">';
    html += '<div class="table-card-header">';
    html += '<div class="table-card-info">';
    html += '<div class="title"><code class="match-code">' + escHtml(r.code) + '</code> ' + escHtml(r.name) + '</div>';
    html += '<div class="meta"><span>' + escHtml(cname) + '</span></div>';
    html += '</div></div>';
    html += '</div>';
  }
  main.innerHTML = html;
}

function handleCardClick(el) {
  const action = el.getAttribute('data-click-action');
  if (action === 'norm-search-result') {
    const code = el.getAttribute('data-norm-code');
    const chapId = parseInt(el.getAttribute('data-norm-chapid'));
    window._initialCode = code;
    navigateToTable(INDEX.tables.find(function(tbl) { return tbl.id === chapId; }), code);
  }
}

document.addEventListener('DOMContentLoaded', function() {
  var main = document.getElementById('mainContent');
  if (main) {
    main.addEventListener('click', function(e) {
      var card = e.target.closest('[data-click-action]');
      if (card) handleCardClick(card);
    });
  }
});

function showSearchResults(results, q, header, main) {
  header.innerHTML = '<div class="breadcrumb">' + t('search_results') + ': <span class="current">' + escHtml(q) + '</span></div><div class="stats"><span><strong>' + results.length + '</strong> ' + (LANG === 'en' ? 'matches' : '个匹配') + '</span></div>';

  let html = '';
  for (const tr of results) {
    const codes = [];
    if (INDEX.code_index) {
      for (const [code, tids] of Object.entries(INDEX.code_index)) {
        const arr = Array.isArray(tids) ? tids : [tids];
        if (arr.includes(tr.id)) codes.push(code);
      }
    }
    codes.sort((a, b) => a.localeCompare(b, undefined, {numeric: true}));

    html += '<div class="table-card" style="cursor:pointer" onclick="navigateToTable(INDEX.tables.find(tbl=>tbl.id===' + tr.id + '))">';
    html += '<div class="table-card-header">';
    html += '<div class="table-card-info">';
    html += '<div class="title">' + escHtml(T(tr.subsection_title, tr.subsection_title_en) || T(tr.section_title, tr.section_title_en) || t('quota_table')) + '</div>';
    html += '<div class="meta">';
    html += '<span>' + fmtPage(tr.page) + '</span>';
    if (tr.chapter_title) html += '<span>' + escHtml(T(tr.chapter_title, tr.chapter_title_en)) + '</span>';
    if (tr.unit) html += '<span class="unit">' + escHtml(tr.unit) + '</span>';
    html += '<span>' + (tr.row_count || 0) + t('records') + '</span>';
    html += '</div></div></div>';
    if (codes.length > 0) {
      html += '<div class="table-card-codes">' + codes.join(', ') + '</div>';
    }
    html += '</div>';
  }
  main.innerHTML = html;
}

                    6: ['设备','Equipment'], 7: ['主材','Main Material'] };
const TIER_LABEL = { 'T1': ['泰国直采','Thailand direct'], 'T2': ['邻国报价','Neighbouring'],
                     'T3': ['中国报价','China quote'], 'T4': ['非洲报价','Africa quote'],

function pnum(v, digits) {
  if (v == null || v === '') return '';
  const n = Number(v);
  if (!isFinite(n)) return '';
  return n.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: digits == null ? 2 : digits });
}
function curLabel() { return CURRENCY === 'cny' ? 'CNY' : ((PACK && PACK.currency) || 'THB'); }

// 部分 CostSpread 行的 country 字段损坏成字面 '??'，不展示假国别
function cleanCountry(c) { return (!c || c === '??') ? '' : c; }

// 数值型换算系数不需要浮点全长度
function fmtFactor(v) {
  if (v == null) return '';
  const n = Number(v);
  return isFinite(n) ? String(parseFloat(n.toPrecision(6))) : String(v);
}

// 43 条直采报价把项目/地点塞在 features 里（project=… | location=… | sheet=…）
function parseFeatures(f) {
  if (!f) return { project: '', location: '', spec: '' };
  if (f.indexOf('project=') < 0) return { project: '', location: '', spec: f };
  const out = { project: '', location: '', spec: '' };
  const parts = f.split('|').map(s => s.trim());
  const rest = [];
  for (const seg of parts) {
    const m = seg.match(/^(\w+)=(.*)$/);
    if (!m) { if (seg) rest.push(seg); continue; }
    if (m[1] === 'project') out.project = m[2].trim();
    else if (m[1] === 'location') out.location = m[2].trim();
  }
  out.spec = rest.join(' ');
  return out;
}

// 项目名：优先 features 里的 project=，否则用来源文件名（多数文件名即项目名）
function quoteProject(q) {
  const f = parseFeatures(q.features);
  if (f.project) return f.project + (f.location ? ' · ' + f.location : '');
  return '';
}
function tierLabel(tier) {
  const e = TIER_LABEL[tier];
  return e ? (LANG === 'en' ? e[1] : e[0]) : (tier || '');
}
function tierBadge(tier) {
  if (!tier) return '<span class="tier-badge t-none">' + pt('to_inquire') + '</span>';
  return '<span class="tier-badge t-' + tier + '" title="' + escHtml(tierLabel(tier)) + '">' + tier + '</span>';
}
function covClass(priced, total) {
  if (!total) return '';
  const r = priced / total;
  return r >= 0.8 ? '' : (r >= 0.4 ? 'warn' : 'bad');
}

function switchView(view) {
  VIEW = view;
  localStorage.setItem('norms_view', view);
  const isPrice = view === 'price';
  document.getElementById('tabNorms').classList.toggle('active', !isPrice);
  document.getElementById('tabPrice').classList.toggle('active', isPrice);
  document.getElementById('normsSidebar').classList.toggle('view-hidden', isPrice);
  document.getElementById('normsMain').classList.toggle('view-hidden', isPrice);
  document.getElementById('priceSidebar').classList.toggle('view-hidden', !isPrice);
  document.getElementById('priceMain').classList.toggle('view-hidden', !isPrice);
  document.getElementById('packSelect').style.display = isPrice ? '' : 'none';
  document.getElementById('packNoteBtn').style.display = isPrice ? '' : 'none';
  // 已选定额坞与导出只属于定额库
  const dock = document.getElementById('selDock');
  if (dock) dock.style.display = isPrice ? 'none' : '';

  if (!PIDX) { initPrice(); return; }

  renderPriceNav();

// ── 初始化 ────────────────────────────────────────────────────────────

async function initPrice() {
  try {
    await loadPacks();
    await loadPriceIndex();
    renderPriceNav();
    loadPriceContent();
  } catch (e) {
    document.getElementById('priceNav').innerHTML =
      '<div style="padding:20px;color:red;font-size:12px">加载失败: ' + escHtml(e.message) + '</div>';
    console.error('initPrice error:', e);
  }
}

async function loadPacks() {
  const r = await fetch('/api/price/packs');
  const d = await r.json();
  if (d.error) throw new Error(d.error);
  PACKS = d.packs || [];
  PACK = PACKS.find(p => p.pack === d.default) || PACKS[0] || null;
  applyPackFx();
  const sel = document.getElementById('packSelect');
  sel.innerHTML = PACKS.map(p =>
    '<option value="' + escHtml(p.pack) + '">' + escHtml(T(p.name, p.name_EN)) +
    ' · ' + escHtml(p.currency) + (p.status !== 'active' ? ' (' + escHtml(p.status) + ')' : '') +
    '</option>').join('');
  if (PACK) sel.value = PACK.pack;
}

function applyPackFx() {
  const fx = PACK && PACK.fx && PACK.fx.CNY;
  FX_THB_PER_CNY = (typeof fx === 'number' && fx > 0) ? fx : 5.0;
}

function onPackChange(packId) {
  PACK = PACKS.find(p => p.pack === packId) || PACK;
  applyPackFx();
  PIDX = null;
  closeDrawer();
  initPrice();
}

function showPackNote() {
  if (!PACK) return;
  const lines = [
    T(PACK.name, PACK.name_EN),
    (PACK.country || '') + ' · ' + (PACK.currency || '') +
      (PACK.cutoff_date ? ' · 截止 ' + PACK.cutoff_date : ''),
    '已定价 ' + pnum(PACK.priced_count, 0) + ' 条',

async function loadPriceIndex() {

function renderPriceNav() {
  if (!PIDX) return;
  const nav = document.getElementById('priceNav');
  let h = '';

  h += navBtn({ scope: 'coverage' }, pt('coverage_board'), '', 'nav-chapter');

  h += '<div class="price-nav-group">' + pt('by_volume') + '</div>';
  for (const v of PIDX.vols) {
    const open = PSEL.vol === v.vol;
    h += '<button class="nav-item nav-chapter' + (PSEL.scope === 'vol' && PSEL.vol === v.vol && !PSEL.cls ? ' active' : '') +
         '" onclick="onNavVol(event, \'' + v.vol + '\')">' +
         '<span class="arrow' + (open ? ' open' : '') + '">&#9654;</span>' +
         '<span class="label">' + escHtml(T(v.name, v.name_EN)) + '</span>' +
         '<span class="cov ' + covClass(v.priced, v.total) + '">' +
         v.priced + '/' + v.total + '</span></button>';
    h += '<div class="nav-sub' + (open ? ' open' : '') + '">';
    for (const c of v.classes) {
      const act = PSEL.scope === 'vol' && PSEL.vol === v.vol && PSEL.cls === c.cls;
      h += '<button class="nav-item nav-section' + (act ? ' active' : '') +
           '" onclick="selectPriceScope(\'vol\',\'' + v.vol + '\',' + c.cls + ')">' +
           '<span class="label">' + escHtml(T(c.name, c.name_EN)) + '</span>' +
           '<span class="cov ' + covClass(c.priced, c.total) + '">' +
           c.priced + '/' + c.total + '</span></button>';
    }
    h += '</div>';
  }

  h += '<div class="price-nav-group">' + pt('modules') + '</div>';
  for (const m of PIDX.modules) {
    const act = PSEL.scope === m.key;
    h += '<button class="nav-item nav-chapter' + (act ? ' active' : '') +
         '" onclick="selectPriceScope(\'' + m.key + '\')">' +
         '<span class="label">' + escHtml(T(m.name, m.name_EN)) + '</span>' +
         '<span class="cov ' + covClass(m.priced, m.total) + '">' +
         m.priced + '/' + m.total + '</span></button>';

              PIDX.priced + '/' + PIDX.total, 'nav-chapter');

function navBtn(sel, label, cov, cls) {
  const act = PSEL.scope === sel.scope;

function onNavVol(ev, vol) {

  const wasOpen = PSEL.vol === vol && PSEL.scope === 'vol' && !PSEL.cls;
  PSEL = { scope: 'vol', vol: wasOpen ? PSEL.vol : vol, cls: null };
  renderPriceNav();
  loadPriceContent();
}

function selectPriceScope(scope, vol, cls) {
  PSEL = { scope: scope, vol: vol || null, cls: cls == null ? null : cls };
  closeDrawer();
  renderPriceNav();
  loadPriceContent();

function scopeTitle() {
  if (PSEL.scope === 'vol' && PIDX) {
    const v = PIDX.vols.find(x => x.vol === PSEL.vol);

    const base = T(v.name, v.name_EN);

    return base + ' · ' + (c ? T(c.name, c.name_EN) : '');

    const m = PIDX.modules.find(x => x.key === PSEL.scope);
    if (m) return T(m.name, m.name_EN);

  return pt('price_lib');

  if (!PIDX) return '';

// ── Excel 导出（导出当前页面的完整结果，不受列表 600 条上限影响）──────────

function exportViewKind() {
  if (PSEL.scope === 'coverage') return 'coverage';
  if (PFILTER.priced === 'gap') return 'gap';
  return 'list';
}

async function exportPrice() {
  const btn = document.getElementById('priceExportBtn');
  if (!btn) return;
  const label = btn.textContent;
  btn.disabled = true;
  btn.textContent = t('exporting');
  const old = document.getElementById('priceExportMsg');
  if (old) old.remove();

  const view = exportViewKind();
  const body = {
    view: view,
    pack: PACK ? PACK.pack : '',
    scope: PSEL.scope === 'coverage' ? 'all' : PSEL.scope,
    vol: PSEL.vol || null,
    cls: PSEL.cls == null ? null : PSEL.cls,
  };
  if (view === 'list') {
    if (PFILTER.priced === 'yes' || PFILTER.priced === 'no') body.priced = PFILTER.priced;
    if (PFILTER.tiers.length) body.tier = PFILTER.tiers.join(',');
    if (PFILTER.q) body.q = PFILTER.q;
  }
  if (view === 'gap') { body.gap_limit = 200; body.cand = 5; }

  try {
    const r = await fetch('/api/price/export', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!r.ok) {
      let msg = 'HTTP ' + r.status;
      try { msg = (await r.json()).error || msg; } catch (e) {}
      throw new Error(msg);
    }
    let stats = null;
    try { stats = JSON.parse(decodeURIComponent(r.headers.get('X-Export-Stats') || '')); } catch (e) {}
    const cd = r.headers.get('Content-Disposition') || '';
    const m = cd.match(/filename\*=UTF-8''([^;]+)/);
    const fname = m ? decodeURIComponent(m[1]) : '价格库导出.xlsx';

    const blob = await r.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = fname;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    showExportMsg(fname + (stats ? ' · ' + exportStatsText(stats) : ''), false);
  } catch (e) {
    showExportMsg(t('export_fail') + ': ' + e.message, true);
  } finally {
    btn.disabled = false;
    btn.textContent = label;
  }
}

function exportStatsText(s) {
  const bits = [];
  if (s.rows != null) bits.push(pnum(s.rows, 0) + ' ' + pt('total_items'));
  if (s.priced != null) bits.push(pt('has_price') + ' ' + pnum(s.priced, 0));
  if (s.gaps != null) bits.push(pnum(s.gaps, 0) + ' ' + pt('no_price'));
  if (s.matched != null) bits.push('有候选 ' + pnum(s.matched, 0));
  if (s.vols != null) bits.push(s.vols + ' 册');
  let out = bits.join(' · ');
  if (s.truncated) {
    out += '\n注意：本范围共 ' + pnum(s.gap_total, 0) + ' 条缺口，只导出了引用次数最高的 ' +
           pnum(s.gaps, 0) + ' 条，另有 ' + pnum(s.truncated, 0) +
           ' 条未包含（撮合耗时限制）。缩小范围后可导全。';
  }
  return out;
}

function showExportMsg(text, isErr) {
  const main = document.getElementById('priceContent');
  if (!main) return;
  const old = document.getElementById('priceExportMsg');
  if (old) old.remove();
  const d = document.createElement('div');
  d.id = 'priceExportMsg';
  d.className = 'export-msg' + (isErr ? ' err' : '');
  d.textContent = text;
  main.insertBefore(d, main.firstChild);
  if (!isErr) setTimeout(() => { const e = document.getElementById('priceExportMsg'); if (e) e.remove(); }, 8000);
}

// ── 资源列表 ──────────────────────────────────────────────────────────

async function loadPriceList() {
  const main = document.getElementById('priceContent');
  const header = document.getElementById('priceHeader');
  main.innerHTML = '<div class="placeholder"><div>' + pt('loading') + '</div></div>';

  const p = new URLSearchParams();
  p.set('pack', PACK ? PACK.pack : '');
  p.set('scope', PSEL.scope === 'all' ? 'all' : (PSEL.scope === 'vol' ? 'vol' : PSEL.scope));
  if (PSEL.vol) p.set('vol', PSEL.vol);
  if (PSEL.cls != null) p.set('cls', PSEL.cls);
  if (PFILTER.priced === 'yes' || PFILTER.priced === 'no') p.set('priced', PFILTER.priced);
  if (PFILTER.tiers.length) p.set('tier', PFILTER.tiers.join(','));
  if (PFILTER.q) p.set('q', PFILTER.q);
  p.set('limit', '600');

  let d;
  try {
    const r = await fetch('/api/price/list?' + p.toString());
    d = await r.json();
    if (d.error) throw new Error(d.error);
  } catch (e) {
    main.innerHTML = '<div class="placeholder"><div>' + escHtml(e.message) + '</div></div>';
    return;
  }

  const pct = d.total ? (d.priced / d.total * 100).toFixed(1) + '%' : '—';
  header.innerHTML = priceHeaderHtml(
    '<span class="current">' + escHtml(scopeTitle()) + '</span>',
    '<span><strong>' + pnum(d.total, 0) + '</strong> ' + pt('total_items') + '</span>' +
    '<span>' + pt('has_price') + ' <strong>' + pnum(d.priced, 0) + '</strong> (' + pct + ')</span>' +
    '<span>' + pt('refs') + ' ' + pnum(d.refs, 0) + '</span>');

  let h = renderPriceToolbar(d);
  const note = scopeNote();
  if (note) h += '<div class="scope-note">' + escHtml(note) + '</div>';

  if (!d.items.length) {
    h += '<div class="placeholder" style="height:30vh"><div>' + pt('nothing') + '</div></div>';
    main.innerHTML = h;
    return;
  }

  h += '<div class="table-card"><div class="data-table-wrap"><table class="data-table price-table"><thead><tr>' +
       '<th>' + pt('res_code') + '</th>' +
       '<th>' + pt('res_class') + '</th>' +
       '<th>' + pt('res_name') + '</th>' +
       '<th>' + pt('res_std') + '</th>' +
       '<th>' + t('unit') + '</th>' +
       '<th style="text-align:right">' + t('price_unit') + '(' + curLabel() + ')</th>' +
       '<th>' + pt('source_tier') + '</th>' +
       '<th>' + pt('price_date') + '</th>' +
       '<th style="text-align:right">' + pt('refs') + '</th>' +
       '<th>' + pt('vols') + '</th>' +
       '</tr></thead><tbody>';

  for (const it of d.items) {
    const has = it.price != null;
    h += '<tr class="' + (has ? '' : 'unpriced') + '" data-res="' + it.res_ID +
         '" onclick="openDrawer(' + it.res_ID + ', this)">' +
         '<td class="code-cell">' + escHtml(it.res_Code || '') + '</td>' +
         '<td>' + escHtml(clsLabel(it)) + '</td>' +
         '<td class="c-name">' + escHtml(T(it.res_Name, it.res_Name_EN)) + '</td>' +
         '<td class="c-std">' + escHtml(T(it.res_Standard, it.res_Standard_EN)) + '</td>' +
         '<td>' + escHtml(T(it.res_Unit, it.res_Unit_EN)) + '</td>' +
         '<td class="num">' + (has ? pnum(cur(it.price)) : '—') + '</td>' +
         '<td>' + tierBadge(it.tier) + '</td>' +
         '<td style="color:var(--text-faint);font-size:10px">' + escHtml(it.price_date || '') + '</td>' +
         '<td class="num">' + pnum(it.refs, 0) + '</td>' +
         '<td style="font-size:10px;color:var(--text-dim)">' + escHtml((it.vols || []).join('')) + '</td>' +
         '</tr>';
  }
  h += '</tbody></table></div></div>';
  if (d.total > d.items.length) {
    h += '<div style="padding:10px 2px;font-size:11px;color:var(--text-faint)">' +
         '显示前 ' + d.items.length + ' 条，共 ' + pnum(d.total, 0) + ' 条。用搜索或筛选缩小范围。</div>';
  }
  main.innerHTML = h;
}

function clsLabel(it) {
  const e = CLS_LABEL[it.cons_Style] || CLS_LABEL[it.res_Class];
  if (e) return LANG === 'en' ? e[1] : e[0];
  return it.res_Class_Name || '';

function renderPriceToolbar(d) {
  let h = '<div class="price-toolbar">';
  h += '<span>' + pt('has_price') + '/' + pt('no_price') + '</span>';
  for (const [val, label] of [['', pt('all_items')], ['yes', pt('has_price')], ['no', pt('no_price')]]) {
    h += '<button class="tier-chip' + (PFILTER.priced === val ? ' on' : '') +
         '" onclick="setPriced(\'' + val + '\')">' + escHtml(label) + '</button>';
  }
  h += '<span style="margin-left:12px">' + pt('source_tier') + '</span><span class="tier-filter">';
  for (const tier of TIER_ORDER) {
    h += '<button class="tier-chip' + (PFILTER.tiers.includes(tier) ? ' on' : '') +
         '" title="' + escHtml(tierLabel(tier)) + '" onclick="toggleTier(\'' + tier + '\')">' + tier + '</button>';
  }
  h += '</span>';
  if (PSEL.scope === 'me_main') {
    h += '<span class="spacer"></span><button class="tier-chip" onclick="openGapWorkbench()">' +
         pt('match_workbench') + ' &#8594;</button>';
  }
  h += '</div>';
  return h;
}

// ── 详情抽屉 ──────────────────────────────────────────────────────────

async function openDrawer(resId, tr) {
  document.querySelectorAll('.price-table tr.sel').forEach(el => el.classList.remove('sel'));
  if (tr) tr.classList.add('sel');
  const drawer = document.getElementById('priceDrawer');
  const body = document.getElementById('drawerBody');
  drawer.classList.add('open');
  body.innerHTML = '<div class="drawer-empty">' + pt('loading') + '</div>';

  let d;
  try {
    const r = await fetch('/api/price/detail?res_id=' + resId +
                          '&pack=' + encodeURIComponent(PACK ? PACK.pack : ''));
    d = await r.json();
    if (d.error) throw new Error(d.error);
  } catch (e) {
    body.innerHTML = '<div class="drawer-empty">' + escHtml(e.message) + '</div>';
    return;
  }
  renderDrawer(d);
}

function closeDrawer() {
  const d = document.getElementById('priceDrawer');
  if (d) d.classList.remove('open');
  document.querySelectorAll('.price-table tr.sel').forEach(el => el.classList.remove('sel'));
}

function renderDrawer(d) {
  const r = d.resource, p = d.price;
  document.getElementById('drawerName').textContent =
    T(r.res_Name, r.res_Name_EN) + (r.res_Standard ? '  ' + T(r.res_Standard, r.res_Standard_EN) : '');
  document.getElementById('drawerSub').textContent =
    [r.res_Code, r.res_Class_Name, T(r.res_Unit, r.res_Unit_EN)].filter(Boolean).join(' · ');

  let h = '';

  // 台账价
  h += '<div class="drawer-sec"><h4>' + pt('ledger_price') + '</h4>';
  if (!p) {
    h += '<div class="drawer-empty">' + pt('no_price_yet') + ' — ' + pt('to_inquire') + '</div>';
  } else {
    h += '<div style="display:flex;align-items:baseline;gap:12px;margin-bottom:8px">' +
         '<span class="big-price">' + pnum(cur(p.price)) +
         '<span class="cur">' + curLabel() + '</span></span>' + tierBadge(p.tier) +
         '<span style="font-size:11px;color:var(--text-dim)">' + escHtml(tierLabel(p.tier)) +
         ' · ' + escHtml(p.price_kind || '') + '</span></div>';
    h += '<div class="kv-grid">';
    h += kv(pt('price_date'), p.price_date);
    if (p.price_excl != null) h += kv(pt('tax_excl'), pnum(cur(p.price_excl)) + ' ' + curLabel());
    if (p.price_incl != null) h += kv(pt('tax_incl'), pnum(cur(p.price_incl)) + ' ' + curLabel());
    if (p.src_price != null) {
      const sc = cleanCountry(p.src_country);
      h += kv('原始报价', pnum(p.src_price) + ' ' + (p.src_currency || '') +
              ' / ' + (p.src_unit || '') + (sc ? ' · ' + sc : ''), true);
    }
    if (p.fx_rate != null) h += kv('汇率', fmtFactor(p.fx_rate), true);
    if (p.unit_factor != null && p.unit_factor !== 1) h += kv('单位换算', fmtFactor(p.unit_factor), true);
    if (p.supplier) h += kv(pt('supplier'), p.supplier);
    if (p.source_doc) h += kv(pt('source_doc'), p.source_doc);
    if (p.source) h += kv(pt('derivation'), p.source);
    if (p.remark && p.remark !== p.source) h += kv('备注', p.remark);
    h += '</div>';
  }
  h += '</div>';

  // 直采锚点
  if (d.anchors && d.anchors.length) {
    h += '<div class="drawer-sec"><h4>' + pt('anchors') + '</h4><div class="kv-grid">';
    for (const a of d.anchors) {
      h += kv(pnum(a.thb_price) + ' THB', [a.supplier, a.project, a.address, a.quote_date]
              .filter(Boolean).join(' · ') || (a.source || ''));
    }
    h += '</div></div>';
  }

  // 候选报价
  h += '<div class="drawer-sec"><h4>' + pt('cand_quotes') +
       (d.quotes.length ? ' (' + d.quotes.length + ')' : '') + '</h4>';
  if (!d.quotes.length) {
    h += '<div class="drawer-empty">' + pt('no_quotes') + '</div>';
  } else {
    h += '<table class="drawer-table"><thead><tr>' +
         '<th>' + pt('res_name') + '</th><th>' + t('unit') + '</th>' +
         '<th>' + pt('country') + '</th><th class="num">' + pt('tax_incl') + '</th>' +
         '<th>' + pt('quote_date') + '</th><th>' + pt('supplier') + '</th>' +
         '<th>' + pt('source_doc') + '</th><th>' + pt('match_way') + '</th></tr></thead><tbody>';
    for (const q of d.quotes) {
      const f = parseFeatures(q.features);
      const nm = T(q.name, q.name_en) + (f.spec ? ' · ' + f.spec : '');
      const proj = quoteProject(q);
      h += '<tr>' +
           '<td>' + escHtml(nm.replace(/\s+/g, ' ').slice(0, 60)) + '</td>' +
           '<td>' + escHtml(q.unit || '') + '</td>' +
           '<td>' + escHtml(cleanCountry(q.country)) + '</td>' +
           '<td class="num">' + pnum(q.price_incl) + ' <span style="color:var(--text-faint)">' +
             escHtml(q.currency || '') + '</span></td>' +
           '<td>' + escHtml(q.quote_date || '') + '</td>' +
           '<td>' + escHtml(q.supplier || '') + '</td>' +
           '<td class="src">' + (proj ? '<b>' + escHtml(proj) + '</b><br>' : '') +
             escHtml(q.source_doc || '') +
             (q.specialty ? '<br>' + escHtml(q.specialty) : '') + '</td>' +
           '<td>' + escHtml(q.match_type || '') + ' ' + tierBadge(q.tier) + '</td>' +
           '</tr>';
    }
    h += '</tbody></table>';
  }
  h += '</div>';

  // 各册原始写法
  h += '<div class="drawer-sec"><h4>' + pt('vol_writing') + '</h4>';
  if (!d.aliases.length) {
    h += '<div class="drawer-empty">—</div>';
  } else {
    h += '<table class="drawer-table"><thead><tr><th>册</th><th>' + pt('res_name') + '</th>' +
         '<th>' + pt('res_std') + '</th><th>' + t('unit') + '</th>' +
         '<th class="num">' + pt('refs') + '</th><th>' + pt('match_way') + '</th></tr></thead><tbody>';
    for (const a of d.aliases) {
      h += '<tr><td>' + escHtml(a.src_vol) + '</td>' +
           '<td>' + escHtml(a.src_Name || '') + '</td>' +
           '<td>' + escHtml(a.src_Standard || '') + '</td>' +
           '<td>' + escHtml(a.src_Unit || '') + '</td>' +
           '<td class="num">' + pnum(a.refs, 0) + '</td>' +
           '<td>' + escHtml(a.match_type || '') + '</td></tr>';
    }
    h += '</tbody></table>';
  }
  h += '</div>';

  // 引用定额
  h += '<div class="drawer-sec"><h4>' + pt('norms_using') +
       (d.norms.length ? ' (' + d.norms.length + ')' : '') + '</h4>';
  if (!d.norms.length) {
    h += '<div class="drawer-empty">—</div>';
  } else {
    h += '<table class="drawer-table"><thead><tr><th>册</th><th>' + t('quota_code') + '</th>' +
         '<th>' + t('item_name') + '</th><th>' + t('unit') + '</th>' +
         '<th class="num">' + t('consumption') + '</th></tr></thead><tbody>';
    for (const n of d.norms) {
      h += '<tr><td>' + escHtml(n.vol) + '</td>' +
           '<td style="font-family:\'JetBrains Mono\',monospace;color:var(--accent)">' +
             escHtml(n.norm_Code || '') + '</td>' +
           '<td>' + escHtml(T(n.norm_Name, n.norm_Name_EN)) + '</td>' +
           '<td>' + escHtml(n.norm_Units || '') + '</td>' +
           '<td class="num">' + pnum(n.cont_Amount, 4) + ' ' +
             '<span style="color:var(--text-faint)">' + escHtml(n.cons_Units || '') + '</span></td></tr>';
    }
    h += '</tbody></table>';
  }
  h += '</div>';

  document.getElementById('drawerBody').innerHTML = h;
}

function kv(k, v, mono) {
  if (v == null || v === '') return '';
  return '<div class="k">' + escHtml(k) + '</div><div class="v' + (mono ? ' mono' : '') + '">' +
         escHtml(String(v)) + '</div>';
}

// ── 覆盖总览 ──────────────────────────────────────────────────────────

async function loadCoverage() {
  const main = document.getElementById('priceContent');
  const header = document.getElementById('priceHeader');
  main.innerHTML = '<div class="placeholder"><div>' + pt('loading') + '</div></div>';

  let d;
  try {
    const r = await fetch('/api/price/coverage?pack=' + encodeURIComponent(PACK ? PACK.pack : '') +
                          '&gap_limit=60');
    d = await r.json();
    if (d.error) throw new Error(d.error);
  } catch (e) {
    main.innerHTML = '<div class="placeholder"><div>' + escHtml(e.message) + '</div></div>';
    return;
  }

  const s = d.summary;
  header.innerHTML = priceHeaderHtml(
    '<span class="current">' + pt('coverage_board') + '</span>',
    '<span>' + pt('has_price') + ' <strong>' + pnum(s.priced, 0) + '</strong> / ' + pnum(s.total, 0) +
      ' (' + (s.priced / s.total * 100).toFixed(1) + '%)</span>' +
    '<span>' + pt('refs') + ' <strong>' + (s.refs_priced / s.refs * 100).toFixed(1) + '%</strong> ' +
      pnum(s.refs_priced, 0) + '/' + pnum(s.refs, 0) + '</span>');

  const vols = [], byCell = {};
  const clsSet = new Set();
  for (const m of d.matrix) {
    if (!vols.includes(m.vol)) vols.push(m.vol);
    clsSet.add(m.cls);
    byCell[m.vol + '|' + m.cls] = m;
  }
  const clss = [...clsSet].sort((a, b) => a - b);

  let h = '<div class="drawer-sec"><h4>' + pt('cov_matrix') + '</h4>';
  h += '<div class="data-table-wrap"><table class="cov-matrix"><thead><tr><th></th>';
  for (const c of clss) {
    const e = CLS_LABEL[c];
    h += '<th>' + escHtml(e ? (LANG === 'en' ? e[1] : e[0]) : c) + '</th>';
  }
  h += '</tr></thead><tbody>';
  for (const v of vols) {
    const vname = (PIDX.vols.find(x => x.vol === v) || {}).name || v;
    h += '<tr><td class="rowhead">' + escHtml(vname) + '</td>';
    for (const c of clss) {
      const m = byCell[v + '|' + c];
      if (!m) { h += '<td class="na">—</td>'; continue; }
      const pctv = m.priced / m.total * 100;
      const cls = pctv >= 80 ? '' : (pctv >= 40 ? 'warn' : 'bad');
      h += '<td class="cov-cell"><span class="pct ' + cls + '" style="color:' +
           (pctv >= 80 ? 'var(--text)' : (pctv >= 40 ? '#b8863a' : 'var(--accent)')) + '">' +
           pctv.toFixed(1) + '%</span>' +
           '<span class="frac">' + m.priced + '/' + m.total + '</span></td>';
    }
    h += '</tr>';
  }
  h += '</tbody></table></div></div>';

  h += '<div class="drawer-sec"><h4>' + pt('reliability') + '</h4><div class="tier-bar">';
  for (const tier of TIER_ORDER) {
    const rows = d.tiers.filter(x => x.tier === tier);
    if (!rows.length) continue;
    const n = rows.reduce((a, b) => a + b.n, 0);
    h += '<div class="tb">' + tierBadge(tier) +
         '<span>' + escHtml(tierLabel(tier)) + '</span>' +
         '<span class="n">' + pnum(n, 0) + '</span></div>';
  }
  h += '</div></div>';

  h += '<div class="drawer-sec"><h4>' + pt('gap_top') + '</h4>';
  h += '<div class="table-card"><div class="data-table-wrap">' +
       '<table class="data-table price-table"><thead><tr>' +
       '<th style="text-align:right">' + pt('refs') + '</th>' +
       '<th>' + pt('res_class') + '</th><th>' + pt('res_name') + '</th>' +
       '<th>' + pt('res_std') + '</th><th>' + t('unit') + '</th>' +
       '<th>' + pt('vols') + '</th></tr></thead><tbody>';
  for (const g of d.gaps) {
    h += '<tr onclick="openDrawer(' + g.res_ID + ', this)">' +
         '<td class="num" style="font-weight:600;color:var(--accent)">' + pnum(g.refs, 0) + '</td>' +
         '<td>' + escHtml(g.res_Class_Name || '') + '</td>' +
         '<td class="c-name">' + escHtml(T(g.res_Name, g.res_Name_EN)) + '</td>' +
         '<td class="c-std">' + escHtml(g.res_Standard || '') + '</td>' +
         '<td>' + escHtml(T(g.res_Unit, g.res_Unit_EN)) + '</td>' +
         '<td style="font-size:10px;color:var(--text-dim)">' + escHtml((g.vols || []).join('')) + '</td>' +
         '</tr>';
  }
  h += '</tbody></table></div></div></div>';

  main.innerHTML = h;
}

// ── 机电主材缺口撮合 ──────────────────────────────────────────────────

function openGapWorkbench() { PFILTER.priced = 'gap'; loadGapWorkbench(); }
function closeGapWorkbench() { PFILTER.priced = ''; loadPriceList(); }

async function loadGapWorkbench() {
  const main = document.getElementById('priceContent');
  const header = document.getElementById('priceHeader');
  main.innerHTML = '<div class="placeholder"><div>' + pt('loading') + '</div></div>';

  const p = new URLSearchParams();
  p.set('pack', PACK ? PACK.pack : '');
  p.set('scope', PSEL.scope);
  if (PSEL.vol) p.set('vol', PSEL.vol);
  if (PSEL.cls != null) p.set('cls', PSEL.cls);
  p.set('limit', '40');

  let d;
  try {
    const r = await fetch('/api/price/gap?' + p.toString());
    d = await r.json();
    if (d.error) throw new Error(d.error);
  } catch (e) {
    main.innerHTML = '<div class="placeholder"><div>' + escHtml(e.message) + '</div></div>';
    return;
  }

  header.innerHTML = priceHeaderHtml(
    escHtml(scopeTitle()) + '<span class="sep">/</span><span class="current">' +
      pt('match_workbench') + '</span>',
    '<span>' + d.count + ' ' + pt('total_items') + '</span>' +
    '<span>有候选 <strong>' + d.matched + '</strong></span>' +
    '<span>报价池 ' + pnum(d.pool_size, 0) + '</span>');

  let h = '<div class="price-toolbar">' +
          '<button class="tier-chip" onclick="closeGapWorkbench()">&#8592; 返回列表</button>' +
          '<span style="color:var(--text-faint)">候选由名称相似度排序，仅作询价线索；' +
          '单位不符的会标出来，需人工判断后走脚本补价。</span></div>';

  for (const it of d.items) {
    h += '<div class="gap-pair"><div class="gap-left">' +
         '<div class="g-name">' + escHtml(T(it.res_Name, it.res_Name_EN)) + '</div>' +
         '<div class="g-meta">' +
         (it.res_Standard ? escHtml(it.res_Standard) + '<br>' : '') +
         escHtml(T(it.res_Unit, it.res_Unit_EN)) + ' · ' + escHtml(it.res_Class_Name || '') +
         '<br>' + pt('refs') + ' <strong style="color:var(--accent)">' + pnum(it.refs, 0) + '</strong>' +
         ' · ' + escHtml((it.vols || []).join('')) +
         '<br><span style="font-family:\'JetBrains Mono\',monospace;font-size:10px">' +
         escHtml(it.res_Code || '') + '</span>' +
         '</div></div><div class="gap-right">';
    if (!it.candidates.length) {
      h += '<div class="no-cand">' + pt('no_cand') + '</div>';
    } else {
      h += '<table class="drawer-table"><tbody>';
      for (const c of it.candidates) {
        const f = parseFeatures(c.features);
        const proj = quoteProject(c);
        h += '<tr>' +
             '<td style="width:40px" class="num">' + c.score.toFixed(2) + '</td>' +
             '<td>' + escHtml((T(c.name, c.name_en) || '').replace(/\s+/g, ' ').slice(0, 40)) +
               (f.spec ? '<br><span style="color:var(--text-faint);font-size:10px">' +
                 escHtml(f.spec.replace(/\s+/g, ' ').slice(0, 40)) + '</span>' : '') + '</td>' +
             '<td>' + escHtml(c.unit || '') +
               (c.unit_match ? '' : '<span class="unit-warn">' + pt('unit_mismatch') + '</span>') + '</td>' +
             '<td class="num">' + pnum(c.price_incl) + ' <span style="color:var(--text-faint)">' +
               escHtml(c.currency || '') + '</span></td>' +
             '<td>' + escHtml(c.quote_date || '') + '</td>' +
             '<td class="src">' + escHtml(c.supplier || '') +
               (proj ? '<br><b>' + escHtml(proj) + '</b>' : '') +
               (c.source_doc ? '<br>' + escHtml(c.source_doc.slice(0, 34)) : '') + '</td>' +
             '<td>' + tierBadge(c.tier) + '</td>' +
             '</tr>';
      }
      h += '</tbody></table>';
    }
    h += '</div></div>';
  }
  main.innerHTML = h;
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape' && VIEW === 'price') closeDrawer();
});

init().catch(err => {
  document.getElementById('sidebarNav').innerHTML =
    '<div style="padding:20px;color:red;font-size:12px">加载失败: ' + err.message + '</div>';
  console.error('init error:', err);
});

// 恢复上次所在视图
if (VIEW === 'price') switchView('price');
</script>
